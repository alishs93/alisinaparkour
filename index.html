<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>پارکور علی سینا</title>
    <title>پارکور علی سینا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: #87ceeb;
            user-select: none;
            -webkit-user-select: none
        }
        
        body.playing {
            touch-action: none
        }
        
        #game {
            position: fixed;
            inset: 0;
            z-index: 0
        }
        
        .hidden {
            display: none!important
        }
        
        .panel {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(rgba(8, 18, 38, .5), rgba(8, 18, 38, .72));
            z-index: 100;
            padding: 20px;
            text-align: center;
            overflow-y: auto
        }
        
        h1 {
            color: #fff;
            font-size: min(10vw, 52px);
            font-weight: 900;
            text-shadow: 0 4px 0 rgba(0, 0, 0, .4), 0 0 30px rgba(100, 180, 255, .5)
        }
        
        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 3px 0 rgba(0, 0, 0, .4)
        }
        
        .sub {
            color: #eaf4ff;
            font-size: 15px;
            line-height: 2.1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .6)
        }
        
        .btn {
            min-width: min(75vw, 320px);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(#6cc94f, #48a336);
            border: 3px solid rgba(0, 0, 0, .3);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .3);
            touch-action: manipulation;
            transition: transform .06s
        }
        
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, .3)
        }
        
        .btn.alt {
            background: linear-gradient(#5aa7e8, #3d7fc4)
        }
        
        .btn.gray {
            background: linear-gradient(#8a93a3, #666e7c)
        }
        
        .btn.gold {
            background: linear-gradient(#f5c542, #d9a520)
        }
        
        .chip {
            background: rgba(15, 25, 45, .6);
            color: #fff;
            padding: 6px 13px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(6px)
        }
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 50;
            pointer-events: none
        }
        
        #hud .sp {
            flex: 1
        }
        
        .hudbtn {
            pointer-events: auto;
            background: rgba(15, 25, 45, .6);
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            touch-action: manipulation
        }
        
        #touchZone {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
            touch-action: none
        }
        
        body.playing.touch #touchZone {
            display: block
        }
        
        #joyBase {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(49, 48, 48, 0.637);
            border: 2px solid rgba(255, 255, 255, .3);
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none
        }
        
        #joyKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5);
            transform: translate(-50%, -50%)
        }
        
        #jumpBtn {
            position: fixed;
            right: 24px;
            bottom: 30px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(49, 48, 48, 0.637);
            border: 2px solid rgba(255, 255, 255, .4);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            touch-action: manipulation
        }
        
        body.playing.touch #jumpBtn {
            display: flex
        }
        
        .badge {
            background: #ffd54a;
            color: #5a4500;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 15px
        }
        
        #toast {
            position: fixed;
            top: 16%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 25, 45, .7);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 200;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            white-space: nowrap
        }
        
        #toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }
        
        #errbox {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #7a1f1f;
            color: #fff;
            padding: 12px;
            font-size: 13px;
            z-index: 999;
            display: none;
            direction: ltr;
            text-align: left
        }
        /* استایل‌های جدید موزیک */
        
        .music-box {
            background: rgba(0, 0, 0, .3);
            border-radius: 12px;
            padding: 15px;
            width: min(85vw, 340px);
            display: flex;
            flex-direction: column;
            gap: 8px
        }
        
        .music-box label {
            color: #fff;
            font-size: 14px;
            font-weight: 700
        }
        
        .music-select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, .3);
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            direction: ltr;
            text-align: left
        }
        
        .music-select option {
            background: #2a3a5a;
            color: #fff
        }
        
        .now-playing {
            color: #ffd54a;
            font-size: 12px;
            margin-top: 4px;
            min-height: 18px
        }
        
        .vol-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-size: 13px
        }
        
        .vol-row input {
            flex: 1;
            accent-color: #6cc94f
        }
    </style>
</head>

<body>
    <div id="game"></div>
    <div id="touchZone">
        <div id="joyBase">
            <div id="joyKnob"></div>
        </div>
    </div>
    <div id="jumpBtn">پرش</div>
    <div id="toast"></div>

    <div id="hud" class="hidden">
        <div class="chip" id="scoreChip">امتیاز: ۰</div>

    <!-- منوی توقف با قابلیت انتخاب موزیک -->
    <div id="pausePanel" class="panel hidden">
        <h2>⏸ توقف</h2>

        <div class="music-box">
            <label>🎵 موزیک ماینکرافت</label>
            <select class="music-select" id="musicSelect">
      <option value="none">— بدون موزیک —</option>
      <option value="procedural">🎹 ملودی آرامش‌بخش (پیش‌فرض)</option>

        <option value="relic">Relic 🆕</option>

    </select>
            <div class="now-playing" id="nowPlaying"></div>
            <div class="vol-row">
                <span>🔈</span>
                <input type="range" id="musicVol" min="0" max="100" value="40">

            </div>
        </div>

        <button class="btn" data-act="resume">ادامه</button>
        <button class="btn alt" data-act="restart">شروع دوباره</button>

        <button class="btn gray" data-act="pauseDev">🔁 تغییر دستگاه</button>

    <div id="deadPanel" class="panel hidden">
        <h2>سقوط کردی! 💥</h2>
        <div class="sub">امتیاز: <b id="deadScore">۰</b><br>رکورد: <b id="deadBest">۰</b></div>
        <div class="badge hidden" id="deadNew">🎉 رکورد جدید!</div>
        <button class="btn gold" data-act="cp" id="btnCP">🚩 ادامه از چک‌پوینت</button>
        <button class="btn" data-act="retry">🔄 شروع از اول</button>
        <button class="btn gray" data-act="deadMenu">منوی اصلی</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        'use strict';
        window.addEventListener('error', function(e) {
            var b = document.getElementById('errbox');
            if (b) {
                b.style.display = 'block';
                b.textContent = 'JS Error: ' + e.message + ' (line ' + e.lineno + ')';
            }
        });

        function $id(i) {
            return document.getElementById(i);
        }
        var el = {
            device: $id('devicePanel'),
            menu: $id('menuPanel'),
            help: $id('helpPanel'),
            pause: $id('pausePanel'),
            dead: $id('deadPanel'),
            hud: $id('hud'),
            tz: $id('touchZone'),
            jb: $id('joyBase'),
            jk: $id('joyKnob'),
            jump: $id('jumpBtn'),
            mb: $id('menuBest'),
            mc: $id('menuCoins'),
            ht: $id('helpText'),
            ds: $id('deadScore'),
            db: $id('deadBest'),
            dn: $id('deadNew'),
            cpb: $id('btnCP'),
            sc: $id('scoreChip'),
            cc: $id('coinChip'),
            bc: $id('bestChip'),
            pc: $id('powChip'),
            snd: $id('btnSound'),
            mSel: $id('musicSelect'),
            np: $id('nowPlaying'),
            mVol: $id('musicVol'),
            vLbl: $id('volLabel')
        };

        var state = 'device',
            touchMode = false,
            thirdPerson = true,
            score = 0,
            best = 0,
            coinsTotal = 0,
            unlocked = false,
            runStartBest = 0,
            shieldCharges = 0;
        var soundOn = true;
        try {
            soundOn = localStorage.getItem('pk_sound') !== '0';
        } catch (e) {}
        var checkpoint = null;

        function toFa(n) {
            return String(n).replace(/\d/g, function(d) {
                return '۰۱۲۳۴۵۶۷۸۹' [d];
            });
        }

        function sh(e) {
            if (e) e.classList.remove('hidden');
        }

        function hi(e) {
            if (e) e.classList.add('hidden');
        }

        function hideAll() {
            hi(el.device);
            hi(el.menu);
            hi(el.help);
            hi(el.pause);
            hi(el.dead);
        }

        function openPanel(p) {
            hideAll();
            sh(p);
        }
        var toastT = null;

        function toast(m) {
            var t = $id('toast');
            t.textContent = m;
            t.classList.add('on');
            clearTimeout(toastT);
            toastT = setTimeout(function() {
                t.classList.remove('on');
            }, 2300);
        }

        var SKEY = 'pas_save';

        function saveData() {
            try {
                var d = JSON.stringify({
                    best: best,
                    coins: coinsTotal,
                    unlocked: unlocked
                });
                localStorage.setItem(SKEY, d);
                document.cookie = SKEY + '=' + encodeURIComponent(d) + ';max-age=31536000;path=/;SameSite=Lax';
            } catch (e) {}
        }

        function loadData() {
            try {
                var d = localStorage.getItem(SKEY);
                if (!d) {
                    var m = document.cookie.match(/(?:^|; )pas_save=([^;]*)/);
                    if (m) d = decodeURIComponent(m[1]);
                }
                if (d) {
                    var o = JSON.parse(d);
                    best = o.best || 0;
                    coinsTotal = o.coins || 0;
                    unlocked = !!o.unlocked;
                }
            } catch (e) {}
            if (coinsTotal >= 30) unlocked = true;
        }
        loadData();

        /* ============================================
           سیستم موزیک ماینکرافت
           ============================================ */
        var MUSIC_BASE = 'https://raw.githubusercontent.com/C418-Music/Minecraft-Music/main/';
        // نگاشت کلید → مسیر فایل واقعی
        var MUSIC_MAP = {
            calm1: 'Volume Alpha/calm/calm1.ogg',
            calm2: 'Volume Alpha/calm/calm2.ogg',
            calm3: 'Volume Alpha/calm/calm3.ogg',
            hal1: 'Volume Alpha/hal/hal1.ogg',
            hal2: 'Volume Alpha/hal/hal2.ogg',
            hal3: 'Volume Alpha/hal/hal3.ogg',
            hal4: 'Volume Alpha/hal/hal4.ogg',
            nuance1: 'Volume Alpha/nuance/nuance1.ogg',
            nuance2: 'Volume Alpha/nuance/nuance2.ogg',
            piano1: 'Volume Alpha/piano/piano1.ogg',
            piano2: 'Volume Alpha/piano/piano2.ogg',
            piano3: 'Volume Alpha/piano/piano3.ogg',
            alpha: 'Volume Beta/alpha.ogg',
            beta: 'Volume Beta/beta.ogg',
            biome_fest: 'Volume Beta/biome_fest.ogg',
            blindness: 'Volume Beta/blindness.ogg',
            chirp: 'Volume Beta/chirp.ogg',
            far: 'Volume Beta/far.ogg',
            mall: 'Volume Beta/mall.ogg',
            mellohi: 'Volume Beta/mellohi.ogg',
            stal: 'Volume Beta/stal.ogg',
            strad: 'Volume Beta/strad.ogg',
            ward: 'Volume Beta/ward.ogg',
            wait: 'Volume Beta/wait.ogg',
            wilt: 'Volume Beta/wilt.ogg',
            ki: 'Volume Beta/ki.ogg',
            mutation: 'Volume Beta/mutation.ogg',
            moog_city_2: 'Volume Beta/moog_city_2.ogg',
            concrete_halls: 'Volume Beta/concrete_halls.ogg',
            dead_voxel: 'Volume Beta/dead_voxel.ogg',
            warmth: 'Volume Beta/warmth.ogg',
            floating_trees: 'Volume Beta/floating_trees.ogg',
            aria_math: 'Volume Beta/aria_math.ogg',
            taswell: 'Volume Beta/taswell.ogg',
            the_end: 'Volume Beta/the_end.ogg',
            dreiton: 'Volume Beta/dreiton.ogg',
            pigstep: 'Nether Update/pigstep.ogg',
            otherside: 'Caves & Cliffs/otherside.ogg',
            rubedo: 'Nether Update/rubedo.ogg',
            so_below: 'Nether Update/so_below.ogg',
            firebugs: 'Nether Update/firebugs.ogg',
            labyrinthine: 'Nether Update/labyrinthine.ogg',
            ballad_of_the_cats: 'Nether Update/ballad_of_the_cats.ogg',
            comforting_memories: 'Trails & Tales/comforting_memories.ogg',
            floating_dream: 'Trails & Tales/floating_dream.ogg',
            one_more_day: 'Trails & Tales/one_more_day.ogg',
            stand_tall: 'Trails & Tales/stand_tall.ogg',
            left_to_bloom: 'Trails & Tales/left_to_bloom.ogg',
            ancestry: 'Trails & Tales/ancestry.ogg',
            wending: 'Trails & Tales/wending.ogg',
            infinite_amethyst: 'Trails & Tales/infinite_amethyst.ogg',
            aerie: 'Trails & Tales/aerie.ogg',
            relic: 'Trails & Tales/relic.ogg',
            creator: 'Trails & Tales/creator.ogg',
            precipice: '2024/precipice.ogg',
            echo_in_the_wind: '2024/echo_in_the_wind.ogg',
            broken_clocks: '2024/broken_clocks.ogg',
            featherfall: '2024/featherfall.ogg',
            watcher: '2024/watcher.ogg',
            puzzlebox: '2024/puzzlebox.ogg',
            doomsday: '2024/doomsday.ogg'
        };

        var mcAudio = null,
            currentTrack = 'procedural',
            musicVolume = 0.4;
        try {
            var savedTrack = localStorage.getItem('pk_music');
            if (savedTrack) currentTrack = savedTrack;
            var savedVol = localStorage.getItem('pk_mvol');
            if (savedVol) musicVolume = parseFloat(savedVol);
        } catch (e) {}

        function stopMusic() {
            if (mcAudio) {
                mcAudio.pause();
                mcAudio.src = '';
                mcAudio = null;
            }
            clearTimeout(musicTimer);
        }

        function playMCTrack(key) {
            stopMusic();
            if (key === 'none') {
                el.np.textContent = '';
                return;
            }
            if (key === 'procedural') {
                startProcedural();
                el.np.textContent = '🎹 ملودی آرامش‌بخش';
                return;
            }
            var path = MUSIC_MAP[key];
            if (!path) {
                el.np.textContent = '❌ آهنگ یافت نشد';
                return;
            }
            mcAudio = new Audio(MUSIC_BASE + path);
            mcAudio.volume = musicVolume;
            mcAudio.loop = true;
            mcAudio.onended = function() {
                if (currentTrack === key && state !== 'device') mcAudio.play().catch(function() {});
            };
            mcAudio.onerror = function() {
                el.np.textContent = '❌ خطا در بارگذاری';
                toast('آهنگ بارگذاری نشد');
            };
            mcAudio.play().then(function() {
                var opt = el.mSel.querySelector('option[value="' + key + '"]');
                el.np.textContent = '🎵 ' + opt.textContent;
            }).catch(function() {
                el.np.textContent = '⚠ کلیک کنید تا پخش شود';
            });
        }

        function makeCharacter() {

        function movReg(m) {
            for (var i = 0; i < m.keys.length; i++) BM.delete(m.keys[i]);
            m.keys = [];
            for (var j = 0; j < m.ent.length; j++) {
                var e = m.ent[j];
                var k = (m.sx + e.dx) + ',' + m.y + ',' + (m.z + e.dz);
                BM.set(k, {
                    plat: m.plat,
                    type: 'mov',
                    mesh: null

                m.keys.push(k);
            }
        }

        function genPlat(i) {
            var t = Math.min(i / 28, 1),
                pv = plats[plats.length - 1];
            var sp = null;
            if (i >= 8 && Math.random() < .12 + .08 * t) sp = 'moving';
            else if (i >= 6) {
                var r = Math.random();
                if (r < .12) sp = 'ice';
                else if (r < .23) sp = 'slime';
                else if (r < .33) sp = 'break';
            }
            var dy = 0;
            if (i >= 3) {
                var r2 = Math.random(),
                    dp = .3 + .25 * t;
                if (sp === 'moving') dy = Math.random() < .5 ? 0 : -1;
                else if (r2 < .15) dy = 1;
                else if (r2 < .15 + dp) dy = -(1 + (Math.random() * (1 + Math.round(2 * t)) | 0));
                else dy = 0;
            }
            var ny = Math.max(5, Math.min(22, pv.y + dy));
            dy = ny - pv.y;
            var mg = sp === 'moving' ? 2 : dy === 1 ? 1 : dy === 0 ? (t < .4 ? 2 : 3) : dy === -1 ? 3 : 4;
            var gap = Math.max(1, Math.round(1 + Math.random() * (mg - 1) * (.35 + .65 * t)));
            var w = Math.max(1, Math.round(2.7 - t * 1.5 - Math.random() * .7)),
                d = Math.random() < .5 * t ? 1 : 2;
            if (sp === 'ice') {
                w = Math.max(2, w);
                d = 2;
            }
            if (sp === 'break') d = Math.max(2, d);
            var x = Math.max(-8, Math.min(8, pv.x + Math.round((Math.random() - .5) * (1 + 2 * t)))),
                z = pv.z + pv.d + gap;
            var tm = {
                ice: 'ice',
                slime: 'slime',
                break: 'brk',
                moving: 'mov'
            };
            var type = sp ? tm[sp] : ['grass', 'grass', 'stone', 'plank', 'sand', 'log'][Math.random() * 6 | 0];
            var ms2 = [],
                mv = null;
            if (sp === 'moving') {
                w = 2;
                mv = {
                    plat: i,
                    y: ny,
                    z: z,
                    w: w,
                    d: d,
                    bx: x,
                    cx: x,
                    sx: x,
                    ph: Math.random() * 6.28,
                    spd: .8 + Math.random() * .7 + t * .7,
                    amp: 1 + Math.random() * .6 + t * .4,
                    ent: [],
                    meshes: [],
                    keys: []
                };
                for (var a = 0; a < w; a++)
                    for (var b = 0; b < d; b++) {
                        var m = new THREE.Mesh(BG, mats.mov);
                        m.castShadow = m.receiveShadow = true;
                        m.position.set(x + a + .5, ny + .5, z + b + .5);
                        scene.add(m);
                        mv.ent.push({
                            dx: a,
                            dz: b
                        });
                        mv.meshes.push(m);
                    }
                movers.push(mv);
                movReg(mv);
            } else {
                for (var a = 0; a < w; a++)
                    for (var b = 0; b < d; b++) {
                        ms2.push(addBlock(x + a, ny, z + b, type, i));
                        ms2.push(addBlock(x + a, ny - 1, z + b, type === 'grass' ? 'dirt' : 'stone', i));
                    }
                if (Math.random() < .65) addCoin(x + (Math.random() * w | 0) + .5, ny + 1.25, z + (Math.random() * d | 0) + .5, i);
                if (i % 10 === 0) addFlag(x, ny, z, ms2);
            }
            plats.push({
                index: i,
                x: x,
                y: ny,
                z: z,
                w: w,
                d: d,
                meshes: ms2,
                mover: mv
            });
            npi = i + 1;
        }

        function removePlat(p) {
            for (var i = 0; i < p.meshes.length; i++) {
                var e = p.meshes[i];
                scene.remove(e.mesh);
                if (e.key) {
                    BM.delete(e.key);
                    breakT.delete(e.key);
                }
            }
            if (p.mover) {
                for (var j = 0; j < p.mover.keys.length; j++) BM.delete(p.mover.keys[j]);
                for (var k2 = 0; k2 < p.mover.meshes.length; k2++) scene.remove(p.mover.meshes[k2]);
                var ix = movers.indexOf(p.mover);
                if (ix >= 0) movers.splice(ix, 1);
            }
            coinsArr = coinsArr.filter(function(c) {
                if (c.plat === p.index) {
                    scene.remove(c.mesh);
                    return false;
                }
                return true;
            });
        }

        function ensureWorld(cur) {
            while (npi < cur + 8) genPlat(npi);
            var kf = Math.min(cur - 4, checkpoint ? checkpoint.plat : cur - 4);
            while (plats.length && plats[0].index < kf) removePlat(plats.shift());
        }

        function resetWorld() {

            movers = [];
            coinsArr = [];

            npi = 1;
            buildStart();
            for (var j = 1; j < 8; j++) genPlat(j);

        var PW = .3,
            PH = 1.8,
            GV = 28,
            JV = 8.4,

        function collides(px, py, pz) {
            var x0 = Math.floor(px - PW),
                x1 = Math.floor(px + PW),
                y0 = Math.floor(py),
                y1 = Math.floor(py + PH - .001),
                z0 = Math.floor(pz - PW),
                z1 = Math.floor(pz + PW);
            for (var x = x0; x <= x1; x++)
                for (var y = y0; y <= y1; y++)
                    for (var z = z0; z <= z1; z++)
                        if (BM.has(x + ',' + y + ',' + z)) return true;
            return false;
        }

        function probe(py) {
            var y = Math.floor(py);
            for (var a = 0; a < 2; a++)
                for (var b = 0; b < 2; b++) {
                    var ox = a ? -0.25 : 0.25,
                        oz = b ? -0.25 : 0.25;
                    var k = Math.floor(P.pos.x + ox) + ',' + y + ',' + Math.floor(P.pos.z + oz);
                    var v = BM.get(k);
                    if (v) return v;
                }
            return null;
        }

        function tryJump() {
            if (state !== 'playing') return;
            if (P.og) {
                P.vel.y = JV;
                P.og = false;
                jumpCount = 0;
                sfx('j');
            } else if (unlocked && jumpCount < 1) {
                P.vel.y = JV * .95;
                jumpCount = 1;
                sfx('dj');
            } else jumpBuf = .12;
        }

        function updMovers(dt) {
            for (var i = 0; i < movers.length; i++) {
                var m = movers[i];
                m.ph += dt * m.spd;
                var pc = m.cx;
                m.cx = m.bx + Math.sin(m.ph) * m.amp;
                var ns = Math.round(m.cx);
                if (ns !== m.sx) {
                    m.sx = ns;
                    movReg(m);
                }
                for (var k = 0; k < m.meshes.length; k++) m.meshes[k].position.x = m.cx + m.ent[k].dx + .5;
                if (P.og) {
                    var pu = probe(P.pos.y - .05);
                    if (pu && pu.plat === m.plat) P.pos.x += m.cx - pc;
                }
            }
        }

        function collapseB(key) {
            var info = BM.get(key);
            if (!info || !info.mesh) return;
            BM.delete(key);
            breakT.delete(key);
            falling.push({
                mesh: info.mesh,
                vy: 0,
                t: 0,
                rx: (Math.random() - .5) * 4,
                rz: (Math.random() - .5) * 4
            });
            sfx('br');
        }

        function collectC(i) {
            var c = coinsArr[i];
            scene.remove(c.mesh);
            coinsArr.splice(i, 1);
            coinsTotal++;
            sfx('co');
            saveData();
            if (!unlocked && coinsTotal >= 30) {
                unlocked = true;
                shieldCharges = 1;
                sfx('ul');
                saveData();
                toast('🎉 ۳۰ سکه! پرش دوبل و سپر فعال شد!');
            }
            updHUD();
        }

        function physStep(dt) {
            updMovers(dt);
            var gi = P.og ? probe(P.pos.y - .05) : null,
                icy = gi && gi.type === 'ice';
            var ix = inp.x,
                iz = inp.y,
                l = Math.hypot(ix, iz);
            if (l > 1) {
                ix /= l;
                iz /= l;
            }
            var sy = Math.sin(yaw),
                cy = Math.cos(yaw),
                mx = -sy * iz + cy * ix,
                mz = -cy * iz - sy * ix;
            var ac = P.og ? (icy ? 7 : 70) : 25;
            P.vel.x += (mx * SP - P.vel.x) * Math.min(1, ac * dt);
            P.vel.z += (mz * SP - P.vel.z) * Math.min(1, ac * dt);
            if (jumpBuf > 0 && P.og) {
                P.vel.y = JV;
                P.og = false;
                jumpCount = 0;
                jumpBuf = 0;
                sfx('j');
            }
            jumpBuf -= dt;
            P.vel.y = Math.max(P.vel.y - GV * dt, -40);
            var nx = P.pos.x + P.vel.x * dt;
            if (collides(nx, P.pos.y, P.pos.z)) P.vel.x = 0;
            else P.pos.x = nx;
            var nz = P.pos.z + P.vel.z * dt;
            if (collides(P.pos.x, P.pos.y, nz)) P.vel.z = 0;
            else P.pos.z = nz;
            var ny = P.pos.y + P.vel.y * dt;
            if (collides(P.pos.x, ny, P.pos.z)) {
                if (P.vel.y < 0) {
                    var hit = probe(ny);
                    if (hit && hit.type === 'slime' && P.vel.y < -3) {
                        P.vel.y = 10.5;
                        jumpCount = 0;
                        shakeAmt = Math.max(shakeAmt, .2);
                        sfx('bo');
                    } else {
                        if (P.vel.y < -12) sfx('la');
                        if (P.vel.y < -9) shakeAmt = Math.max(shakeAmt, Math.min(.4, (-P.vel.y - 8) * .05));
                        var sn = Math.floor(ny) + 1;
                        if (!collides(P.pos.x, sn, P.pos.z)) P.pos.y = sn;
                        P.og = true;
                        jumpCount = 0;
                    }
                }
                if (P.og) P.vel.y = 0;
                else P.vel.y = Math.max(P.vel.y, 0);
            } else {
                P.pos.y = ny;
                P.og = false;
            }
            if (P.og) {
                var gb = probe(P.pos.y - .05);
                if (gb && gb.type === 'brk' && !breakT.has(gb.key)) {
                    breakT.set(gb.key, 1);
                    sfx('cr');
                }
                if (gb && gb.plat !== lastPlat) {
                    lastPlat = gb.plat;
                    if (gb.plat > score) {
                        score = gb.plat;
                        updHUD();
                        sfx('sc');
                        if (score > best) {
                            best = score;
                            saveData();
                        }
                        if (score % 10 === 0) {
                            var pl = null;
                            for (var i = 0; i < plats.length; i++)
                                if (plats[i].index === score) {
                                    pl = plats[i];
                                    break;
                                }
                            if (pl) {
                                checkpoint = {
                                    plat: score,
                                    score: score,
                                    pos: new THREE.Vector3(pl.x + pl.w / 2, pl.y + 1.01, pl.z + pl.d / 2)
                                };
                                sfx('cp');
                                toast('🚩 چک‌پوینت!');
                            }
                        }
                        ensureWorld(gb.plat);
                    }
                }
            }
            var keysArr = Array.from(breakT.keys());
            for (var bi = 0; bi < keysArr.length; bi++) {
                var kk = keysArr[bi],
                    tv = breakT.get(kk),
                    nv = tv - dt;
                if (nv <= 0) collapseB(kk);
                else breakT.set(kk, nv);
            }
            for (var ci = coinsArr.length - 1; ci >= 0; ci--) {
                var c = coinsArr[ci];
                var dx = c.x - P.pos.x,
                    dy2 = c.y - (P.pos.y + .9),
                    dz = c.z - P.pos.z;
                if (dx * dx + dy2 * dy2 + dz * dz < 1.15) collectC(ci);
            }
            var my = 1e9;
            for (var pi = 0; pi < plats.length; pi++)
                if (plats[pi].y < my) my = plats[pi].y;
            if (P.pos.y < my - 9) fallOut();
        }

        function initAudio() {
            if (!soundOn) return;
            if (!audioStarted) {
                audioStarted = true;
                try {
                    actx = new(window.AudioContext || window.webkitAudioContext)();
                    master = actx.createGain();
                    master.gain.value = .45;
                    master.connect(actx.destination);
                    delayN = actx.createDelay();
                    delayN.delayTime.value = .65;
                    var fb = actx.createGain();
                    fb.gain.value = .4;
                    delayN.connect(fb);
                    fb.connect(delayN);
                    var w = actx.createGain();
                    w.gain.value = .4;
                    delayN.connect(w);
                    w.connect(master);
                    if (currentTrack === 'procedural') startProcedural();
                    else if (currentTrack !== 'none') playMCTrack(currentTrack);
                } catch (e) {}
            }
            if (actx && actx.state === 'suspended') actx.resume();
        }

        function padN(f, v) {
            if (!actx) return;
            var o = actx.createOscillator(),
                g = actx.createGain(),
                l = actx.createOscillator(),
                lg = actx.createGain();
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.value = v;
            l.type = 'sine';
            l.frequency.value = .05 + Math.random() * .05;
            lg.gain.value = v * .4;
            l.connect(lg);
            lg.connect(g.gain);
            o.connect(g);
            g.connect(master);
            o.start();
            l.start();
        }
        var mel = [440, 493.88, 554.37, 659.25, 739.99, 880];

        function pluck(f, dur) {
            if (!actx) return;
            var o = actx.createOscillator(),
                g = actx.createGain(),
                t = actx.currentTime;
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(.09, t + .15);
            g.gain.exponentialRampToValueAtTime(.0008, t + dur);
            o.connect(g);
            g.connect(master);
            g.connect(delayN);
            o.start(t);
            o.stop(t + dur + .1);
        }

        function startProcedural() {
            padN(110, .05);
            padN(164.81, .04);
            padN(220, .03);
            padN(277.18, .02);
            padN(329.63, .018);
            schM();
        }

        function schM() {
            if (!soundOn || currentTrack !== 'procedural') return;
            if (Math.random() < .85) pluck(mel[Math.random() * mel.length | 0], 2.8);
            musicTimer = setTimeout(schM, 1400 + Math.random() * 1800);
        }

        function tn(f0, f1, dur, vol, type, off) {
            if (!actx) return;
            var t = actx.currentTime + (off || 0),
                o = actx.createOscillator(),
                g = actx.createGain();
            o.type = type || 'sine';
            o.frequency.setValueAtTime(f0, t);
            if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(.001, t + dur);
            o.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + dur + .05);
        }

        function sfx(k) {
            if (!soundOn || !actx) return;
            if (k === 'j') tn(300, 560, .12, .15);
            else if (k === 'dj') tn(420, 760, .14, .14);
            else if (k === 'la') tn(150, 70, .1, .12, 'triangle');
            else if (k === 'sc') tn(880, 0, .22, .08);
            else if (k === 'co') {
                tn(988, 0, .08, .1);
                tn(1319, 0, .18, .1, 'sine', .07);
            } else if (k === 'cp') {
                tn(659, 0, .12, .1);
                tn(880, 0, .25, .1, 'sine', .12);
            } else if (k === 'bo') tn(180, 520, .18, .14);
            else if (k === 'br') tn(220, 80, .14, .13, 'square');
            else if (k === 'cr') tn(700, 500, .05, .05, 'square');
            else if (k === 'ul') {
                tn(523, 0, .15, .1);
                tn(659, 0, .15, .1, 'sine', .13);
                tn(784, 0, .15, .1, 'sine', .26);
                tn(1047, 0, .4, .1, 'sine', .39);
            } else if (k === 'di') tn(300, 60, .6, .14, 'sawtooth');
        }

        var _v1 = new THREE.Vector3(),

        function updCamera(dt) {
            _v1.set(P.pos.x, P.pos.y + 1.62, P.pos.z);
            var cp = Math.cos(pit),
                sp = Math.sin(pit);
            _v2.set(-Math.sin(yaw) * cp, sp, -Math.cos(yaw) * cp);
            var third = thirdPerson || state !== 'playing';
            PM.visible = third;
            if (third) {
                camera.position.copy(_v1).addScaledVector(_v2, -4.1);
                camera.position.y += .4;
                camera.lookAt(_v3.copy(_v1).addScaledVector(_v2, 3));
            } else {
                camera.position.copy(_v1);
                camera.rotation.y = yaw;
                camera.rotation.x = pit;
            }
            if (shakeAmt > .002) {
                camera.position.x += (Math.random() - .5) * shakeAmt;
                camera.position.y += (Math.random() - .5) * shakeAmt;
                camera.position.z += (Math.random() - .5) * shakeAmt;
                shakeAmt *= Math.exp(-7 * dt);
            } else shakeAmt = 0;
            skyMesh.position.copy(camera.position);
            sunSpr.position.set(camera.position.x + 120, camera.position.y + 170, camera.position.z + 320);
            sun.position.set(P.pos.x + 60, P.pos.y + 90, P.pos.z + 40);
            sun.target.position.copy(P.pos);

        function loop(now) {
            requestAnimationFrame(loop);
            var dt = Math.min((now - lastT) / 1000, .05);
            lastT = now;
            if (!gameReady) return;
            if (state === 'playing') {
                if (!touchMode) {
                    var k = pollKeys();
                    inp.x = k.x;
                    inp.y = k.y;
                } else if (joy.id === null) {
                    inp.x = 0;
                    inp.y = 0;
                }
                accum = Math.min(accum + dt, .25);
                var step = 1 / 120;
                while (accum >= step) {
                    physStep(step);
                    accum -= step;
                }
            } else if (state === 'menu' || state === 'device') {
                menuTime += dt;
                yaw = menuTime * .3;
                pit = -.22;
            }
            var spd = Math.hypot(P.vel.x, P.vel.z);
            if (state === 'playing' && spd > .6) walkT += dt * (4 + spd);
            else walkT *= .85;
            var sw = P.og ? Math.sin(walkT) * .65 : .5;
            CP.ll.rotation.x = sw;
            CP.lr.rotation.x = -sw;
            CP.al.rotation.x = -sw * .7;
            CP.ar.rotation.x = sw * .7;
            PM.position.copy(P.pos);
            if (spd > .6) {
                var ta = Math.atan2(P.vel.x, P.vel.z);
                var d = ta - PM.rotation.y;
                while (d > Math.PI) d -= 6.28;
                while (d < -Math.PI) d += 6.28;
                PM.rotation.y += d * .15;
            }
            for (var i = 0; i < clouds.length; i++) {
                var c = clouds[i];
                c.position.x += dt * 1.2;
                if (c.position.x > camera.position.x + 180) c.position.x -= 360;
                if (c.position.z < camera.position.z - 60) c.position.z += 360;
            }
            for (var fi = falling.length - 1; fi >= 0; fi--) {
                var f = falling[fi];
                f.vy -= 30 * dt;
                f.mesh.position.y += f.vy * dt;
                f.mesh.rotation.x += f.rx * dt;
                f.mesh.rotation.z += f.rz * dt;
                f.t += dt;
                if (f.t > 1.4) {
                    scene.remove(f.mesh);
                    falling.splice(fi, 1);
                }
            }
            for (var ci = 0; ci < coinsArr.length; ci++) {
                var cn = coinsArr[ci];
                cn.mesh.rotation.y += dt * 2.5;
                cn.mesh.position.y = cn.y + Math.sin(now * .002 + cn.ph) * .12;
            }
            updCamera(dt);
            R.render(scene, camera);
        }
        syncMenu();
        syncSound();
        if (gameReady) {
            resetWorld();
            requestAnimationFrame(loop);
        }
    </script>
</body>

</html>
