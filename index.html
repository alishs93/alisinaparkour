<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پارکور کرافت</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
         :root {
            --glass: rgba(15, 25, 45, .55)
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #87ceeb;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none
        }
        
        #game {
            position: fixed;
            inset: 0
        }
        
        .hidden {
            display: none!important
        }
        
        .panel {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 13px;
            background: linear-gradient(rgba(8, 18, 38, .45), rgba(8, 18, 38, .66));
            z-index: 30;
            padding: 22px;
            text-align: center
        }
        
        h1 {
            color: #fff;
            font-size: min(10vw, 54px);
            font-weight: 900;
            text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 34px rgba(120, 200, 255, .55);
            margin-bottom: 6px
        }
        
        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 3px 0 rgba(0, 0, 0, .35)
        }
        
        .sub {
            color: #eaf4ff;
            font-size: 15px;
            line-height: 2;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .6)
        }
        
        .btn {
            min-width: min(72vw, 300px);
            padding: 13px 22px;
            font-family: inherit;
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(#6cc94f, #48a336);
            border: 3px solid rgba(0, 0, 0, .28);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .28);
            transition: transform .06s
        }
        
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, .28)
        }
        
        .btn.alt {
            background: linear-gradient(#5aa7e8, #3d7fc4)
        }
        
        .btn.gray {
            background: linear-gradient(#8a93a3, #666e7c)
        }
        
        .chip {
            background: var(--glass);
            color: #fff;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            backdrop-filter: blur(6px)
        }
        
        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 20
        }
        
        #hud .sp {
            flex: 1
        }
        
        .icobtn {
            pointer-events: auto;
            background: var(--glass);
            border: none;
            color: #fff;
            font-size: 17px;
            padding: 8px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit
        }
        
        #joyBase {
            position: fixed;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            border: 2px solid rgba(255, 255, 255, .35);
            z-index: 25;
            display: none;
            pointer-events: none;
            transform: translate(-50%, -50%)
        }
        
        #joyKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .55);
            transform: translate(-50%, -50%)
        }
        
        #jumpBtn {
            position: fixed;
            right: 24px;
            bottom: 30px;
            width: 94px;
            height: 94px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .16);
            border: 2px solid rgba(255, 255, 255, .4);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            z-index: 25;
            display: none
        }
        
        body.ingame.touch #jumpBtn {
            display: block
        }
        
        .badge {
            background: #ffd54a;
            color: #5a4500;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 15px
        }
    </style>
</head>

<body>
    <div id="game"></div>

    <div id="hud" class="hidden">
        <div class="chip" id="scoreChip">امتیاز: ۰</div>
        <div class="chip" id="bestChip">رکورد: ۰</div>
        <div class="sp"></div>
        <button class="icobtn" id="pauseBtn">⏸ توقف</button>
    </div>

    <div id="joyBase">
        <div id="joyKnob"></div>
    </div>
    <div id="jumpBtn">پرش</div>

    <div id="menu" class="panel">
        <h1>پارکور کرافت</h1>
        <div class="sub" id="bestLine">بهترین رکورد: ۰</div>
        <button class="btn" id="startBtn">▶ شروع بازی</button>
        <button class="btn alt" id="helpBtn">📖 راهنما</button>
        <button class="btn gray" id="soundBtn">🔊 صدا: روشن</button>
        <div class="sub" style="font-size:12px;opacity:.8">ساخته‌شده با ❤️</div>
    </div>

    <div id="help" class="panel hidden">
        <h2>راهنما</h2>
        <div class="sub" id="helpText"></div>
        <button class="btn alt" id="helpBack">بازگشت</button>
    </div>

    <div id="pause" class="panel hidden">
        <h2>توقف</h2>
        <button class="btn" id="resumeBtn">ادامه</button>
        <button class="btn alt" id="restartBtn">شروع دوباره</button>
        <button class="btn gray" id="pauseMenuBtn">منوی اصلی</button>
    </div>

    <div id="gameover" class="panel hidden">
        <h2>سقوط کردی! 💥</h2>
        <div class="sub">امتیاز: <b id="finalScore">۰</b><br>رکورد: <b id="goBest">۰</b></div>
        <div class="badge hidden" id="newRec">🎉 رکورد جدید!</div>
        <button class="btn" id="retryBtn">🔄 دوباره تلاش کن</button>
        <button class="btn gray" id="goMenuBtn">منوی اصلی</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        'use strict';
        if (!window.THREE) {
            document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:Tahoma">خطا: Three.js بارگذاری نشد. به اینترنت نیاز است (یا فایل three.min.js را کنار همین فایل بگذار و آدرس اسکریپت را محلی کن).</div>';
            throw new Error('no THREE');
        }

        /* ---------- پایه ---------- */
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        if (isTouch) document.body.classList.add('touch');
        const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹' [d]);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const approach = (v, t, a) => v < t ? Math.min(v + a, t) : Math.max(v - a, t);
        let state = 'menu',
            score = 0,
            best = +(localStorage.getItem('pk_best') || 0),
            runStartBest = best;
        let soundOn = localStorage.getItem('pk_sound') !== '0';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0xd6ecff, 45, 120);
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1200);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game').appendChild(renderer.domElement);
        const cv = renderer.domElement;

        /* ---------- نور ---------- */
        scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x8a7f5a, 0.9));
        const sun = new THREE.DirectionalLight(0xfff4d6, 1.0);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.bias = -0.001;
        const sc = sun.shadow.camera;
        sc.left = -32;
        sc.right = 32;
        sc.top = 32;
        sc.bottom = -32;
        sc.near = 1;
        sc.far = 300;
        scene.add(sun);
        scene.add(sun.target);

        /* ---------- آسمان، خورشید، ابر ---------- */
        scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 16, 12), new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
            fragmentShader: 'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(0.33,0.60,0.98);vec3 mid=vec3(0.62,0.82,1.0);vec3 bot=vec3(0.88,0.95,1.0);vec3 c=mix(bot,mid,smoothstep(-0.05,0.25,h));c=mix(c,top,smoothstep(0.25,0.75,h));gl_FragColor=vec4(c,1.0);}'
        })));
        const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({
            fog: false,
            transparent: true,
            map: (() => {
                const c = document.createElement('canvas');
                c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32, 32, 4, 32, 32, 30);
                gr.addColorStop(0, 'rgba(255,255,235,1)');
                gr.addColorStop(0.35, 'rgba(255,240,180,.9)');
                gr.addColorStop(1, 'rgba(255,240,180,0)');
                g.fillStyle = gr;
                g.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(c);
            })()
        }));
        sunSpr.scale.set(90, 90, 1);
        scene.add(sunSpr);

        const cloudTex = (() => {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            g.fillStyle = 'rgba(255,255,255,.95)';
            for (let i = 0; i < 14; i++) {
                g.beginPath();
                g.ellipse(20 + Math.random() * 88, 40 + Math.random() * 48, 14 + Math.random() * 18, 8 + Math.random() * 10, 0, 0, Math.PI * 2);
                g.fill();
            }
            return new THREE.CanvasTexture(c);
        })();
        const clouds = [];
        for (let i = 0; i < 12; i++) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
                map: cloudTex,
                transparent: true,
                opacity: .85,
                depthWrite: false,
                fog: false,
                side: THREE.DoubleSide
            }));
            const s = 18 + Math.random() * 26;
            m.scale.set(s, s * .55, 1);
            m.rotation.x = -Math.PI / 2;
            m.position.set((Math.random() - .5) * 320, 34 + Math.random() * 14, Math.random() * 320 - 40);
            scene.add(m);
            clouds.push(m);
        }

        /* ---------- تکسچرهای ماینکرافتی ---------- */
        function tex(paint) {
            const c = document.createElement('canvas');
            c.width = c.height = 16;
            paint(c.getContext('2d'));
            const t = new THREE.CanvasTexture(c);
            t.magFilter = t.minFilter = THREE.NearestFilter;
            return t;
        }
        const rnd = a => a[(Math.random() * a.length) | 0];

        function fill(g, colors) {
            for (let y = 0; y < 16; y++)
                for (let x = 0; x < 16; x++) {
                    g.fillStyle = rnd(colors);
                    g.fillRect(x, y, 1, 1);
                }
        }
        const grassTop = tex(g => fill(g, ['#69c94e', '#5fbd45', '#54b03c', '#74d25a']));
        const dirtT = tex(g => fill(g, ['#9b7653', '#8a684a', '#a37e5b', '#7d5d42']));
        const grassSide = tex(g => {
            fill(g, ['#9b7653', '#8a684a', '#a37e5b', '#7d5d42']);
            for (let x = 0; x < 16; x++) {
                const h = 3 + ((Math.random() * 2) | 0);
                for (let y = 0; y < h; y++) {
                    g.fillStyle = rnd(['#69c94e', '#5fbd45', '#54b03c']);
                    g.fillRect(x, y, 1, 1);
                }
            }
        });
        const stoneT = tex(g => fill(g, ['#8f8f8f', '#9a9a9a', '#7e7e7e', '#a5a5a5', '#858585']));
        const plankT = tex(g => {
            fill(g, ['#b08e5a', '#a8854f', '#b99a66']);
            g.fillStyle = 'rgba(0,0,0,.18)';
            for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1);
        });
        const sandT = tex(g => fill(g, ['#e7dca0', '#ded294', '#efe4ac', '#d8cc8c']));
        const logT = tex(g => {
            for (let x = 0; x < 16; x++) {
                const c = rnd(['#6b4f2e', '#7a5a35', '#5d4427', '#6f5231']);
                for (let y = 0; y < 16; y++) {
                    g.fillStyle = Math.random() < .1 ? rnd(['#5d4427', '#4f3a20']) : c;
                    g.fillRect(x, y, 1, 1);
                }
            }
        });
        const logTop = tex(g => {
            fill(g, ['#b09060', '#a5865a']);
            g.fillStyle = '#7a5a35';
            g.fillRect(2, 2, 12, 12);
            g.fillStyle = '#c4a575';
            g.fillRect(4, 4, 8, 8);
            g.fillStyle = '#8a6a40';
            g.fillRect(6, 6, 4, 4);
        });
        const leavesT = tex(g => fill(g, ['#3e7a24', '#468a2a', '#357020', '#509731', '#2e641c']));
        const ms = t => new THREE.MeshLambertMaterial({
            map: t
        });
        const mats = {
            grass: [ms(grassSide), ms(grassSide), ms(grassTop), ms(dirtT), ms(grassSide), ms(grassSide)],
            dirt: ms(dirtT),
            stone: ms(stoneT),
            plank: ms(plankT),
            sand: ms(sandT),
            log: [ms(logT), ms(logT), ms(logTop), ms(logTop), ms(logT), ms(logT)],
            leaves: new THREE.MeshLambertMaterial({
                map: leavesT
            })
        };

        /* ---------- جهان بلوکی ---------- */
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blockMap = new Map();
        let plats = [];

        function addBlock(x, y, z, type, plat, solid = true) {
            const mesh = new THREE.Mesh(boxGeo, mats[type]);
            mesh.position.set(x + .5, y + .5, z + .5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const key = x + ',' + y + ',' + z;
            if (solid) blockMap.set(key, {
                plat
            });
            return {
                mesh,
                key
            };
        }

        function genPlatform(i) {
            const t = Math.min(i / 28, 1),
                prev = plats[i - 1];
            let dy = 0;
            if (i >= 3) {
                const r = Math.random(),
                    downP = .30 + .25 * t;
                if (r < .15) dy = 1;
                else if (r < .15 + downP) dy = -(1 + ((Math.random() * (1 + Math.round(2 * t))) | 0));
                else dy = 0;
            }
            const ny = clamp(prev.y + dy, 5, 22);
            dy = ny - prev.y;
            let maxGap;
            if (dy === 1) maxGap = 1;
            else if (dy === 0) maxGap = t < .4 ? 2 : 3;
            else if (dy === -1) maxGap = 3;
            else maxGap = 4;
            const gap = Math.max(1, Math.round(1 + Math.random() * (maxGap - 1) * (.35 + .65 * t)));
            const w = Math.max(1, Math.round(2.7 - t * 1.5 - Math.random() * .7));
            const d = Math.random() < .5 * t ? 1 : 2;
            const x = clamp(prev.x + Math.round((Math.random() - .5) * (1 + 2 * t)), -8, 8);
            const z = prev.z + prev.d + gap;
            const type = rnd(['grass', 'grass', 'stone', 'plank', 'sand', 'log']);
            const sub = type === 'grass' ? 'dirt' : 'stone';
            const meshes = [];
            for (let xi = 0; xi < w; xi++)
                for (let zi = 0; zi < d; zi++) {
                    meshes.push(addBlock(x + xi, ny, z + zi, type, i));
                    meshes.push(addBlock(x + xi, ny - 1, z + zi, sub, i));
                }
            plats.push({
                index: i,
                x,
                y: ny,
                z,
                w,
                d,
                meshes
            });
        }

        function buildStart() {
            const y0 = 10,
                meshes = [];
            for (let x = -3; x <= 3; x++)
                for (let z = 0; z <= 6; z++) {
                    meshes.push(addBlock(x, y0, z, 'grass', 0));
                    meshes.push(addBlock(x, y0 - 1, z, 'dirt', 0));
                }
            plats.push({
                index: 0,
                x: -3,
                y: y0,
                z: 0,
                w: 7,
                d: 7,
                meshes
            });
            for (let h = 1; h <= 3; h++) meshes.push(addBlock(-2, y0 + h, 5, 'log', 0));
            for (let dx = -1; dx <= 1; dx++)
                for (let dz = -1; dz <= 1; dz++)
                    for (let dy = 3; dy <= 4; dy++) {
                        if (dy === 4 && Math.abs(dx) === 1 && Math.abs(dz) === 1) continue;
                        meshes.push(addBlock(-2 + dx, y0 + dy, 5 + dz, 'leaves', 0, false));
                    }
            meshes.push(addBlock(-2, y0 + 5, 5, 'leaves', 0, false));
        }

        function removePlat(p) {
            for (const e of p.meshes) {
                scene.remove(e.mesh);
                blockMap.delete(e.key);
            }
        }

        function ensureWorld(cur) {
            while (plats.length < cur + 8) genPlatform(plats.length);
            while (plats.length && plats[0].index < cur - 4) removePlat(plats.shift());
        }

        /* ---------- بازیکن و فیزیک ---------- */
        const player = {
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            onGround: false
        };
        const PW = .3,
            PH = 1.8,
            GRAV = 28,
            JUMP = 8.4,
            SPEED = 5.6;
        let yaw = Math.PI,
            pitch = -.05,
            lastPlat = 0,
            jumpBuf = 0;

        function collides(px, py, pz) {
            const x0 = Math.floor(px - PW),
                x1 = Math.floor(px + PW);
            const y0 = Math.floor(py),
                y1 = Math.floor(py + PH - .001);
            const z0 = Math.floor(pz - PW),
                z1 = Math.floor(pz + PW);
            for (let x = x0; x <= x1; x++)
                for (let y = y0; y <= y1; y++)
                    for (let z = z0; z <= z1; z++)
                        if (blockMap.has(x + ',' + y + ',' + z)) return true;
            return false;
        }

        function platformUnder() {
            const y = Math.floor(player.pos.y) - 1;
            for (const ox of[-.25, .25])
                for (const oz of[-.25, .25]) {
                    const b = blockMap.get(Math.floor(player.pos.x + ox) + ',' + y + ',' + Math.floor(player.pos.z + oz));
                    if (b) return b.plat;
                }
            return null;
        }

        function physStep(dt) {
            let ix = input.x,
                iz = input.y;
            const l = Math.hypot(ix, iz);
            if (l > 1) {
                ix /= l;
                iz /= l;
            }
            const sy = Math.sin(yaw),
                cy = Math.cos(yaw);
            const mx = -sy * iz + cy * ix,
                mz = -cy * iz - sy * ix;
            const acc = player.onGround ? 70 : 25;
            player.vel.x = approach(player.vel.x, mx * SPEED, acc * dt);
            player.vel.z = approach(player.vel.z, mz * SPEED, acc * dt);
            if (jumpBuf > 0 && player.onGround) {
                player.vel.y = JUMP;
                player.onGround = false;
                jumpBuf = 0;
                sfx('jump');
            }
            jumpBuf -= dt;
            player.vel.y = Math.max(player.vel.y - GRAV * dt, -40);
            const nx = player.pos.x + player.vel.x * dt;
            if (collides(nx, player.pos.y, player.pos.z)) player.vel.x = 0;
            else player.pos.x = nx;
            const nz = player.pos.z + player.vel.z * dt;
            if (collides(player.pos.x, player.pos.y, nz)) player.vel.z = 0;
            else player.pos.z = nz;
            const ny = player.pos.y + player.vel.y * dt;
            if (collides(player.pos.x, ny, player.pos.z)) {
                if (player.vel.y < 0) {
                    if (player.vel.y < -12) sfx('land');
                    const snap = Math.floor(ny) + 1;
                    if (!collides(player.pos.x, snap, player.pos.z)) player.pos.y = snap;
                    player.onGround = true;
                }
                player.vel.y = 0;
            } else {
                player.pos.y = ny;
                player.onGround = false;
            }
            if (player.onGround) {
                const p = platformUnder();
                if (p !== null && p !== lastPlat) {
                    lastPlat = p;
                    if (p > score) {
                        score = p;
                        updateHUD();
                        sfx('score');
                        if (score > best) {
                            best = score;
                            localStorage.setItem('pk_best', best);
                        }
                        ensureWorld(p);
                    }
                }
            }
            let minY = 1e9;
            for (const pl of plats)
                if (pl.y < minY) minY = pl.y;
            if (player.pos.y < minY - 9) die();
        }

        function resetWorld() {
            for (const p of plats) removePlat(p);
            plats = [];
            blockMap.clear();
            buildStart();
            for (let i = 1; i < 8; i++) genPlatform(i);
            player.pos.set(.5, 12.5, 3.5);
            player.vel.set(0, 0, 0);
            yaw = Math.PI;
            pitch = -.05;
            lastPlat = 0;
            score = 0;
            jumpBuf = 0;
        }

        /* ---------- ورودی ---------- */
        const input = {
            x: 0,
            y: 0
        };
        const keys = {};
        addEventListener('keydown', e => {
            initAudio();
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space' && state === 'playing') jumpBuf = .15;
            if (e.code === 'Escape') {
                if (state === 'playing' || state === 'paused') togglePause();
            }
            keys[e.code] = true;
        });
        addEventListener('keyup', e => keys[e.code] = false);

        function pollKeys() {
            let x = 0,
                y = 0;
            if (keys.KeyW || keys.ArrowUp) y += 1;
            if (keys.KeyS || keys.ArrowDown) y -= 1;
            if (keys.KeyA || keys.ArrowLeft) x -= 1;
            if (keys.KeyD || keys.ArrowRight) x += 1;
            return {
                x,
                y
            };
        }
        cv.addEventListener('click', () => {
            initAudio();
            if (state === 'playing' && !isTouch) cv.requestPointerLock();
        });
        document.addEventListener('mousemove', e => {
            if (document.pointerLockElement === cv) {
                yaw -= e.movementX * .0024;
                pitch = clamp(pitch - e.movementY * .0024, -1.55, 1.55);
            }
        });
        /* --- لمس --- */
        const joy = {
                id: null,
                bx: 0,
                by: 0
            },
            look = {
                id: null,
                lx: 0,
                ly: 0
            };
        const joyBase = document.getElementById('joyBase'),
            joyKnob = document.getElementById('joyKnob');
        addEventListener('touchstart', e => {
            initAudio();
            const t0 = e.target;
            if (t0.closest && t0.closest('#jumpBtn')) {
                e.preventDefault();
                if (state === 'playing') jumpBuf = .15;
                return;
            }
            if (t0.closest && t0.closest('#pauseBtn')) {
                e.preventDefault();
                togglePause();
                return;
            }
            if (t0.closest && t0.closest('.btn')) return;
            e.preventDefault();
            if (state !== 'playing') return;
            for (const t of e.changedTouches) {
                if (joy.id === null && t.clientX < innerWidth * .45 && t.clientY > innerHeight * .3) {
                    joy.id = t.identifier;
                    joy.bx = t.clientX;
                    joy.by = t.clientY;
                    joyBase.style.display = 'block';
                    joyBase.style.left = t.clientX + 'px';
                    joyBase.style.top = t.clientY + 'px';
                    joyKnob.style.transform = 'translate(-50%,-50%)';
                } else if (look.id === null) {
                    look.id = t.identifier;
                    look.lx = t.clientX;
                    look.ly = t.clientY;
                }
            }
        }, {
            passive: false
        });
        addEventListener('touchmove', e => {
            e.preventDefault();
            for (const t of e.changedTouches) {
                if (t.identifier === joy.id) {
                    let dx = (t.clientX - joy.bx) / 50,
                        dy = (t.clientY - joy.by) / 50;
                    const l = Math.hypot(dx, dy);
                    if (l > 1) {
                        dx /= l;
                        dy /= l;
                    }
                    input.x = dx;
                    input.y = -dy;
                    joyKnob.style.transform = 'translate(calc(-50% + ' + dx * 38 + 'px),calc(-50% + ' + dy * 38 + 'px))';
                } else if (t.identifier === look.id) {
                    const dx = t.clientX - look.lx,
                        dy = t.clientY - look.ly;
                    look.lx = t.clientX;
                    look.ly = t.clientY;
                    yaw -= dx * .0055;
                    pitch = clamp(pitch - dy * .0055, -1.55, 1.55);
                }
            }
        }, {
            passive: false
        });

        function touchEnd(e) {
            for (const t of e.changedTouches) {
                if (t.identifier === joy.id) {
                    joy.id = null;
                    input.x = 0;
                    input.y = 0;
                    joyBase.style.display = 'none';
                }
                if (t.identifier === look.id) look.id = null;
            }
        }
        addEventListener('touchend', touchEnd);
        addEventListener('touchcancel', touchEnd);

        /* ---------- صدا و موزیک ---------- */
        let actx = null,
            master = null,
            delayNode = null,
            started = false,
            musicTimer = null;

        function initAudio() {
            if (!soundOn) return;
            if (!started) {
                started = true;
                actx = new(window.AudioContext || window.webkitAudioContext)();
                master = actx.createGain();
                master.gain.value = .5;
                master.connect(actx.destination);
                delayNode = actx.createDelay();
                delayNode.delayTime.value = .45;
                const fb = actx.createGain();
                fb.gain.value = .3;
                delayNode.connect(fb);
                fb.connect(delayNode);
                const wet = actx.createGain();
                wet.gain.value = .35;
                delayNode.connect(wet);
                wet.connect(master);
                startMusic();
            }
            if (actx.state === 'suspended') actx.resume();
        }

        function startMusic() {
            for (const f of[130.81, 164.81, 196]) {
                const o = actx.createOscillator(),
                    g = actx.createGain();
                o.type = 'sine';
                o.frequency.value = f;
                g.gain.value = .035;
                o.connect(g);
                g.connect(master);
                o.start();
            }
            scheduleNote();
        }
        const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];

        function scheduleNote() {
            if (!soundOn) return;
            const f = scale[(Math.random() * scale.length) | 0];
            const o = actx.createOscillator(),
                g = actx.createGain(),
                t = actx.currentTime;
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(.13, t + .03);
            g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
            o.connect(g);
            g.connect(master);
            g.connect(delayNode);
            o.start(t);
            o.stop(t + 1.7);
            musicTimer = setTimeout(scheduleNote, 500 + Math.random() * 900);
        }

        function sfx(kind) {
            if (!soundOn || !actx) return;
            const t = actx.currentTime,
                o = actx.createOscillator(),
                g = actx.createGain();
            o.connect(g);
            g.connect(master);
            if (kind === 'jump') {
                o.type = 'sine';
                o.frequency.setValueAtTime(300, t);
                o.frequency.exponentialRampToValueAtTime(560, t + .12);
                g.gain.setValueAtTime(.15, t);
                g.gain.exponentialRampToValueAtTime(.001, t + .18);
                o.start(t);
                o.stop(t + .2);
            } else if (kind === 'land') {
                o.type = 'triangle';
                o.frequency.setValueAtTime(150, t);
                o.frequency.exponentialRampToValueAtTime(70, t + .1);
                g.gain.setValueAtTime(.12, t);
                g.gain.exponentialRampToValueAtTime(.001, t + .12);
                o.start(t);
                o.stop(t + .15);
            } else if (kind === 'score') {
                o.type = 'sine';
                o.frequency.setValueAtTime(880, t);
                g.gain.setValueAtTime(.09, t);
                g.gain.exponentialRampToValueAtTime(.001, t + .25);
                o.start(t);
                o.stop(t + .3);
            } else if (kind === 'die') {
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(300, t);
                o.frequency.exponentialRampToValueAtTime(60, t + .6);
                g.gain.setValueAtTime(.14, t);
                g.gain.exponentialRampToValueAtTime(.001, t + .7);
                o.start(t);
                o.stop(t + .75);
            }
        }

        /* ---------- UI ---------- */
        const $ = id => document.getElementById(id);
        const scoreChip = $('scoreChip'),
            bestChip = $('bestChip');

        function updateHUD() {
            scoreChip.textContent = 'امتیاز: ' + toFa(score);
            bestChip.textContent = 'رکورد: ' + toFa(best);
        }

        function show(el) {
            el.classList.remove('hidden');
        }

        function hide(el) {
            el.classList.add('hidden');
        }
        const panels = {
            menu: $('menu'),
            help: $('help'),
            pause: $('pause'),
            gameover: $('gameover')
        };

        function only(p) {
            for (const k in panels) {
                p === panels[k] ? show(panels[k]) : hide(panels[k]);
            }
        }

        function startGame() {
            runStartBest = best;
            resetWorld();
            state = 'playing';
            only(null);
            hide(panels.menu);
            hide(panels.help);
            hide(panels.pause);
            hide(panels.gameover);
            show($('hud'));
            document.body.classList.add('ingame');
            updateHUD();
            initAudio();
            if (!isTouch) cv.requestPointerLock();
        }

        function toMenu() {
            state = 'menu';
            resetWorld();
            hide($('hud'));
            document.body.classList.remove('ingame');
            $('bestLine').textContent = 'بهترین رکورد: ' + toFa(best);
            only(panels.menu);
        }

        function togglePause() {
            if (state === 'playing') {
                state = 'paused';
                only(panels.pause);
                document.exitPointerLock && document.exitPointerLock();
            } else if (state === 'paused') {
                state = 'playing';
                hide(panels.pause);
                if (!isTouch) cv.requestPointerLock();
            }
        }

        function die() {
            if (state !== 'playing') return;
            state = 'dead';
            sfx('die');
            document.exitPointerLock && document.exitPointerLock();
            hide($('hud'));
            document.body.classList.remove('ingame');
            $('finalScore').textContent = toFa(score);
            $('goBest').textContent = toFa(best);
            $('newRec').classList.toggle('hidden', !(score > runStartBest && score > 0));
            only(panels.gameover);
        }
        $('startBtn').onclick = startGame;
        $('retryBtn').onclick = startGame;
        $('restartBtn').onclick = startGame;
        $('resumeBtn').onclick = togglePause;
        $('pauseBtn').onclick = togglePause;
        $('pauseMenuBtn').onclick = toMenu;
        $('goMenuBtn').onclick = toMenu;
        $('helpBack').onclick = () => only(panels.menu);
        $('helpBtn').onclick = () => {
            $('helpText').innerHTML = isTouch ?
                'حرکت: جوی‌استیک سمت چپ<br>نگاه: کشیدن انگشت روی صفحه<br>پرش: دکمه «پرش»<br><br>روی سکوهای بعدی بپر؛ هر سکو ۱ امتیاز.<br>هرچه جلوتر بروی فاصله‌ها بیشتر و سکوها کوچک‌تر می‌شوند. سقوط = پایان!' :
                'حرکت: WASD یا جهت‌نما<br>پرش: Space<br>نگاه: موس (روی صفحه کلیک کن تا موس قفل شود)<br>توقف: Esc<br><br>روی سکوهای بعدی بپر؛ هر سکو ۱ امتیاز.<br>هرچه جلوتر بروی فاصله‌ها بیشتر و سکوها کوچک‌تر می‌شوند. سقوط = پایان!';
            only(panels.help);
        };
        const soundBtn = $('soundBtn');

        function syncSoundBtn() {
            soundBtn.textContent = soundOn ? '🔊 صدا: روشن' : '🔇 صدا: خاموش';
        }
        soundBtn.onclick = () => {
            soundOn = !soundOn;
            localStorage.setItem('pk_sound', soundOn ? '1' : '0');
            syncSoundBtn();
            if (!soundOn) {
                clearTimeout(musicTimer);
            } else {
                started = false;
                initAudio();
            }
        };
        syncSoundBtn();
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && state === 'playing') togglePause();
        });
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        /* ---------- حلقه بازی ---------- */
        let lastT = performance.now(),
            acc = 0,
            menuT = 0;

        function loop(now) {
            requestAnimationFrame(loop);
            let dt = Math.min((now - lastT) / 1000, .05);
            lastT = now;
            if (state === 'playing') {
                if (isTouch && joy.id === null) {
                    const k = pollKeys();
                    input.x = k.x;
                    input.y = k.y;
                } else if (!isTouch) {
                    const k = pollKeys();
                    input.x = k.x;
                    input.y = k.y;
                }
                acc = Math.min(acc + dt, .25);
                const step = 1 / 120;
                while (acc >= step) {
                    physStep(step);
                    acc -= step;
                }
            } else if (state === 'menu') {
                menuT += dt;
                yaw = Math.PI + Math.sin(menuT * .25) * .5;
                pitch = -.12;
                player.pos.set(.5, 11, 3.5);
            }
            camera.position.set(player.pos.x, player.pos.y + 1.62, player.pos.z);
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
            sun.position.set(player.pos.x + 60, player.pos.y + 90, player.pos.z + 40);
            sun.target.position.copy(player.pos);
            sun.target.updateMatrixWorld();
            sunSpr.position.set(camera.position.x + 120, camera.position.y + 170, camera.position.z + 320);
            scene.children[2] && 0; // no-op
            for (const c of clouds) {
                c.position.x += dt * 1.2;
                if (c.position.x > camera.position.x + 180) c.position.x -= 360;
                if (c.position.z < camera.position.z - 60) c.position.z += 360;
            }
            renderer.render(scene, camera);
        }
        resetWorld();
        $('bestLine').textContent = 'بهترین رکورد: ' + toFa(best);
        requestAnimationFrame(loop);
    </script>
</body>
