<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>پارکور باز</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
            background: #87ceeb;
            user-select: none;
            -webkit-user-select: none
        }
        
        body.playing {
            touch-action: none
        }
        
        #game {
            position: fixed;
            inset: 0;
            z-index: 0
        }
        
        .hidden {
            display: none!important
        }
        
        .panel {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(rgba(8, 18, 38, .5), rgba(8, 18, 38, .72));
            z-index: 100;
            padding: 20px;
            text-align: center;
            overflow-y: auto
        }
        
        h1 {
            color: #fff;
            font-size: min(10vw, 52px);
            font-weight: 900;
            text-shadow: 0 4px 0 rgba(0, 0, 0, .4), 0 0 30px rgba(100, 180, 255, .5)
        }
        
        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 3px 0 rgba(0, 0, 0, .4)
        }
        
        .sub {
            color: #eaf4ff;
            font-size: 15px;
            line-height: 2.1;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .6)
        }
        
        .btn {
            min-width: min(75vw, 320px);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(#6cc94f, #48a336);
            border: 3px solid rgba(0, 0, 0, .3);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .3);
            touch-action: manipulation;
            transition: transform .06s
        }
        
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, .3)
        }
        
        .btn.alt {
            background: linear-gradient(#5aa7e8, #3d7fc4)
        }
        
        .btn.gray {
            background: linear-gradient(#8a93a3, #666e7c)
        }
        
        .btn.gold {
            background: linear-gradient(#f5c542, #d9a520)
        }
        
        .chip {
            background: rgba(15, 25, 45, .6);
            color: #fff;
            padding: 6px 13px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(6px)
        }
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 50;
            pointer-events: none
        }
        
        #hud .sp {
            flex: 1
        }
        
        .hudbtn {
            pointer-events: auto;
            background: rgba(15, 25, 45, .6);
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 13px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            touch-action: manipulation
        }
        
        #touchZone {
            position: fixed;
            inset: 0;
            z-index: 40;
            display: none;
            touch-action: none
        }
        
        body.playing.touch #touchZone {
            display: block
        }
        
        #joyBase {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(49, 48, 48, 0.637);
            border: 2px solid rgba(255, 255, 255, .3);
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none
        }
        
        #joyKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .5);
            transform: translate(-50%, -50%)
        }
        
        #jumpBtn {
            position: fixed;
            right: 24px;
            bottom: 30px;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(49, 48, 48, 0.637);
            border: 2px solid rgba(255, 255, 255, .4);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            z-index: 60;
            display: none;
            align-items: center;
            justify-content: center;
            touch-action: manipulation
        }
        
        body.playing.touch #jumpBtn {
            display: flex
        }
        
        .badge {
            background: #ffd54a;
            color: #5a4500;
            font-weight: 900;
            padding: 6px 18px;
            border-radius: 999px;
            font-size: 15px
        }
        
        #toast {
            position: fixed;
            top: 16%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(15, 25, 45, .7);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 200;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            white-space: nowrap
        }
        
        #toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }
        
        #errbox {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #7a1f1f;
            color: #fff;
            padding: 12px;
            font-size: 13px;
            z-index: 999;
            display: none;
            direction: ltr;
            text-align: left
        }
        
        .music-box {
            background: rgba(0, 0, 0, .3);
            border-radius: 12px;
            padding: 15px;
            width: min(85vw, 340px);
            display: flex;
            flex-direction: column;
            gap: 8px
        }
        
        .music-box label {
            color: #fff;
            font-size: 14px;
            font-weight: 700
        }
        
        .music-toggle {
            width: min(85vw, 340px);
            padding: 12px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, .3);
            background: rgba(255, 255, 255, .1);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background .2s
        }
        
        .music-toggle.on {
            background: rgba(108, 201, 79, .35);
            border-color: #6cc94f
        }
        
        #menuPanel {
            zoom: 95%;
        }
    </style>
</head>

<body>
    <div id="game"></div>
    <div id="touchZone">
        <div id="joyBase">
            <div id="joyKnob"></div>
        </div>
    </div>
    <div id="jumpBtn">پرش</div>
    <div id="toast"></div>
    <div id="errbox"></div>

    <div id="hud" class="hidden">
        <div class="chip" id="scoreChip">امتیاز: ۰</div>
        <div class="chip" id="coinChip">🪙 ۰</div>
        <div class="chip" id="bestChip">رکورد: ۰</div>
        <div class="chip" id="powChip"></div>
        <div class="sp"></div>
        <button class="hudbtn" data-act="view">👁 دید</button>
        <button class="hudbtn" data-act="pause">⏸</button>
    </div>

    <div id="menuPanel" class="panel hidden">
        <br><br>
        <h1>پارکور باز</h1>
        <div class="sub" id="menuBest">بهترین رکورد: ۰</div>
        <div class="sub" id="menuCoins"></div>
        <button class="btn" data-act="start">▶ شروع بازی</button>
        <button class="btn alt" data-act="help">📖 راهنما</button>
        <button class="btn gray" data-act="sound" id="btnSound">🔊 صدا: روشن</button>
        <button class="btn gray" data-act="toggleMode" id="btnMode">🎮 حالت: ۲بعدی</button>
        <h4 style="color: white;">ساخته شده توسط علی سینا</h4>
    </div>

    <div id="helpPanel" class="panel hidden">
        <h2>راهنما</h2>
        <div class="sub" id="helpText"></div>
        <button class="btn alt" data-act="helpBack">بازگشت</button>
        <h4 style="color: white;">ساخته شده توسط علی سینا</h4>
    </div>

    <!-- منوی توقف با دکمه موزیک -->
    <div id="pausePanel" class="panel hidden">
        <br><br>
        <h4 style="color: white;">ساخته شده توسط علی سینا</h4>
        <h2>⏸ توقف</h2>

        <button class="btn gray music-toggle" data-act="music" id="btnMusic">🎵 موزیک: روشن</button>

        <button class="btn" data-act="resume">ادامه</button>
        <button class="btn alt" data-act="restart">شروع دوباره</button>
        <button class="btn gray" data-act="pauseMenu">منوی اصلی</button>
        <h4 style="color: white;">ساخته شده توسط علی سینا</h4>
    </div>

    <div id="deadPanel" class="panel hidden">
        <h2>سقوط کردی! 💥</h2>
        <div class="sub">امتیاز: <b id="deadScore">۰</b><br>رکورد: <b id="deadBest">۰</b></div>
        <div class="badge hidden" id="deadNew">🎉 رکورد جدید!</div>
        <button class="btn gold" data-act="cp" id="btnCP">🚩 ادامه از چک‌پوینت</button>
        <button class="btn" data-act="retry">🔄 شروع از اول</button>
        <button class="btn gray" data-act="deadMenu">منوی اصلی</button>
        <h4 style="color: white;">ساخته شده توسط علی سینا</h4>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        'use strict';
        window.addEventListener('error', function(e) {
            var b = document.getElementById('errbox');
            if (b) {
                b.style.display = 'block';
                b.textContent = 'JS Error: ' + e.message + ' (line ' + e.lineno + ')';
            }
        });

        function $id(i) {
            return document.getElementById(i);
        }
        var el = {
            menu: $id('menuPanel'),
            help: $id('helpPanel'),
            pause: $id('pausePanel'),
            dead: $id('deadPanel'),
            hud: $id('hud'),
            tz: $id('touchZone'),
            jb: $id('joyBase'),
            jk: $id('joyKnob'),
            jump: $id('jumpBtn'),
            mb: $id('menuBest'),
            mc: $id('menuCoins'),
            ht: $id('helpText'),
            ds: $id('deadScore'),
            db: $id('deadBest'),
            dn: $id('deadNew'),
            cpb: $id('btnCP'),
            sc: $id('scoreChip'),
            cc: $id('coinChip'),
            bc: $id('bestChip'),
            pc: $id('powChip'),
            snd: $id('btnSound'),
            btnMusic: $id('btnMusic'),
            btnMode: $id('btnMode')
        };

        function detectTouch() {
            const coarse = window.matchMedia('(pointer: coarse)').matches;
            const noHover = window.matchMedia('(hover: none)').matches;
            const touchEvents = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const ua = navigator.userAgent.toLowerCase();
            const isMobileUA = /android|iphone|ipad|ipod|windows phone|blackberry|mobile/i.test(ua);
            return (coarse && noHover) || (touchEvents && isMobileUA);
        }

        var state = 'menu',
            touchMode = detectTouch(),
            gameMode = '2D',
            thirdPerson = true,
            score = 0,
            best = 0,
            coinsTotal = 0,
            unlocked = false,
            runStartBest = 0,
            shieldCharges = 0;
        var soundOn = true;
        try {
            soundOn = localStorage.getItem('pk_sound') !== '0';
        } catch (e) {}
        var checkpoint = null;
        const Z_2D = 0.5;
        var facingRight = true;

        function toFa(n) {
            return String(n).replace(/\d/g, function(d) {
                return '۰۱۲۳۴۵۶۷۸۹' [d];
            });
        }

        function sh(e) {
            if (e) e.classList.remove('hidden');
        }

        function hi(e) {
            if (e) e.classList.add('hidden');
        }

        function hideAll() {
            hi(el.menu);
            hi(el.help);
            hi(el.pause);
            hi(el.dead);
        }

        function openPanel(p) {
            hideAll();
            sh(p);
        }
        var toastT = null;

        function toast(m) {
            var t = $id('toast');
            t.textContent = m;
            t.classList.add('on');
            clearTimeout(toastT);
            toastT = setTimeout(function() {
                t.classList.remove('on');
            }, 2300);
        }

        var SKEY = 'pas_save';

        function saveData() {
            try {
                var d = JSON.stringify({
                    best: best,
                    coins: coinsTotal,
                    unlocked: unlocked
                });
                localStorage.setItem(SKEY, d);
                document.cookie = SKEY + '=' + encodeURIComponent(d) + ';max-age=31536000;path=/;SameSite=Lax';
            } catch (e) {}
        }

        function loadData() {
            try {
                var d = localStorage.getItem(SKEY);
                if (!d) {
                    var m = document.cookie.match(/(?:^|; )pas_save=([^;]*)/);
                    if (m) d = decodeURIComponent(m[1]);
                }
                if (d) {
                    var o = JSON.parse(d);
                    best = o.best || 0;
                    coinsTotal = o.coins || 0;
                    unlocked = !!o.unlocked;
                }
            } catch (e) {}
            if (coinsTotal >= 30) unlocked = true;
        }
        loadData();

        /* ============================================
           موتور موزیک رویه‌ای (Procedural Ambient Music)
           - کاملاً آفلاین، فقط Web Audio API
           - لوپ بی‌درز ۸ میزانی با زمان‌بندی دقیق روی
             ساعت AudioContext (بدون گلیچ، سبک برای موبایل)
           - باس جدا از افکت‌های صوتی (SFX دست‌نخورده)
           - پشتیبانی روز/شب: window.setMusicMood('day'|'night')
             یا ست کردن window.gameIsNight = true/false
           ============================================ */
        var MusicEngine = (function() {
            var BPM = 72,
                BEAT = 60 / BPM,
                BAR = BEAT * 4,
                LOOP_BARS = 8,
                LOOP_LEN = BAR * LOOP_BARS; // ~26.67s لوپ کامل
            // پیشروی آکورد آرام: Am - F - C - G (هر آکورد ۲ میزان)
            var CHORDS = [
                [220.00, 261.63, 329.63], // Am
                [174.61, 220.00, 261.63], // F
                [130.81, 164.81, 196.00], // C
                [196.00, 246.94, 293.66] // G
            ];
            // پنتاتونیک لا مینور (آرامش‌بخش، شبیه حال‌وهوای ماینکرافت)
            var SCALE_DAY = [220, 261.63, 329.63, 392, 440, 523.25, 659.25];
            var SCALE_NIGHT = [110, 130.81, 164.81, 196, 220, 261.63, 329.63];
            var gain = null,
                delay = null,
                running = false,
                schedT = null,
                startTime = 0,
                idx = 0,
                events = [],
                mood = 'day';

            // RNG با بذر ثابت => هر دور لوپ «دقیقاً» همان ملودی است => لوپ بی‌درز
            function mulberry32(seed) {
                return function() {
                    seed |= 0;
                    seed = seed + 0x6D2B79F5 | 0;
                    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            function buildEvents() {
                events = [];
                var night = mood === 'night',
                    scale = night ? SCALE_NIGHT : SCALE_DAY,
                    r = mulberry32(night ? 20240613 : 1379),
                    b, i;
                for (b = 0; b < LOOP_BARS; b++) {
                    var ch = CHORDS[b >> 1],
                        barT = b * BAR;
                    // نت بیس نرم در شروع هر میزان
                    events.push({
                        t: barT,
                        type: 'bass',
                        f: ch[0] / 2,
                        dur: BAR * .95
                    });
                    // پد آکورد شناور
                    for (i = 0; i < ch.length; i++)
                        events.push({
                            t: barT + .05,
                            type: 'pad',
                            f: ch[i],
                            dur: BAR * 1.9
                        });
                    // ملودی پلاک – تراکم کمتر در شب؛ انتهای لوپ خلوت تا برش نامرئی بماند
                    var density = night ? .45 : .7,
                        step, on;
                    for (step = 0; step < 8; step++) {
                        on = r() < density * (step % 2 === 0 ? 1 : .55);
                        if (on && !(b === LOOP_BARS - 1 && step > 5)) {
                            events.push({
                                t: barT + step * BEAT / 2 + (r() * .02),
                                type: 'pluck',
                                f: scale[r() * scale.length | 0],
                                dur: 1.6 + r() * 1.4
                            });
                        }
                    }
                }
                events.sort(function(a, c) {
                    return a.t - c.t;
                });
            }

            function voice(ev, when) {
                var o = actx.createOscillator(),
                    g = actx.createGain(),
                    lp = actx.createBiquadFilter();
                if (ev.type === 'pad') {
                    o.type = 'sine';
                    lp.frequency.value = 900;
                    g.gain.setValueAtTime(0.0001, when);
                    g.gain.linearRampToValueAtTime(.035, when + 1.2);
                    g.gain.linearRampToValueAtTime(0.0001, when + ev.dur);
                } else if (ev.type === 'bass') {
                    o.type = 'triangle';
                    lp.frequency.value = 400;
                    g.gain.setValueAtTime(0.0001, when);
                    g.gain.linearRampToValueAtTime(.06, when + .08);
                    g.gain.exponentialRampToValueAtTime(0.001, when + ev.dur);
                } else { // pluck – شفاف مثل جعبه موزیک
                    o.type = 'triangle';
                    lp.frequency.value = 2400;
                    g.gain.setValueAtTime(0.0001, when);
                    g.gain.linearRampToValueAtTime(.11, when + .04);
                    g.gain.exponentialRampToValueAtTime(0.0008, when + ev.dur);
                    o.connect(g);
                    g.connect(delay); // اکوی ملایم فقط برای ملودی
                }
                lp.type = 'lowpass';
                o.frequency.value = ev.f;
                o.connect(lp);
                lp.connect(g);
                g.connect(gain);
                o.start(when);
                o.stop(when + ev.dur + .15);
            }

            function scheduler() {
                if (!running || !actx) return;
                var horizon = actx.currentTime + .7, // همیشه ~۰.۷ ثانیه جلوتر زمان‌بندی می‌شود
                    ev;
                while (idx < events.length && startTime + events[idx].t <= horizon) {
                    ev = events[idx++];
                    try {
                        voice(ev, Math.max(startTime + ev.t, actx.currentTime + .01));
                    } catch (e) {}
                }
                if (idx >= events.length && startTime + LOOP_LEN <= horizon) {
                    startTime += LOOP_LEN; // برگشت دقیق لوپ روی ساعت صوتی => بی‌درز
                    idx = 0;
                    syncMood(); // اجازه تغییر روز/شب در مرز لوپ
                }
            }

            function setMood(m) {
                if (m !== mood) {
                    mood = m;
                    buildEvents();
                    idx = 0; // اعمال از مرز لوپ => بدون پرش
                }
            }

            function syncMood() {
                if (typeof window.gameIsNight === 'boolean') setMood(window.gameIsNight ? 'night' : 'day');
            }

            function start() {
                if (!actx || running || !musicOn) return;
                if (!gain) {
                    gain = actx.createGain();
                    gain.gain.value = .9;
                    gain.connect(master); // باس مستقل؛ SFX مستقیم به master می‌روند
                    delay = actx.createDelay(2);
                    delay.delayTime.value = BEAT * 1.5;
                    var fb = actx.createGain(),
                        wet = actx.createGain(),
                        dlp = actx.createBiquadFilter();
                    fb.gain.value = .35;
                    wet.gain.value = .3;
                    dlp.type = 'lowpass';
                    dlp.frequency.value = 1800;
                    delay.connect(dlp);
                    dlp.connect(fb);
                    fb.connect(delay);
                    dlp.connect(wet);
                    wet.connect(gain);
                }
                gain.gain.setValueAtTime(.9, actx.currentTime);
                buildEvents();
                startTime = actx.currentTime + .1;
                idx = 0;
                running = true;
                schedT = setInterval(scheduler, 200); // تایمر سبک؛ دقت واقعی از ساعت AudioContext
                scheduler();
            }

            function stop() {
                running = false;
                clearInterval(schedT);
                schedT = null;
                if (gain && actx) {
                    try {
                        gain.gain.setTargetAtTime(0.0001, actx.currentTime, .25); // محو نرم، بدون کلیک
                        setTimeout(function() {
                            if (gain) {
                                gain.disconnect();
                                gain = null;
                                delay = null;
                            }
                        }, 1200);
                    } catch (e) {}
                }
            }

            window.MusicEngine = {
                start: start,
                stop: stop,
                setMood: setMood,
                get mood() {
                    return mood;
                }
            };
            // API برای ایجنت روز/شب:
            window.setMusicMood = function(m) {
                setMood(m === 'night' ? 'night' : 'day');
            };
            return window.MusicEngine;
        })();

        /* ---- دکمه تاگل موزیک (ذخیره وضعیت در localStorage) ---- */
        var musicOn = true;
        try {
            musicOn = localStorage.getItem('pk_music_on') !== '0';
        } catch (e) {}

        function syncMusic() {
            el.btnMusic.textContent = musicOn ? '🎵 موزیک: روشن' : '🔇 موزیک: خاموش';
            el.btnMusic.classList.toggle('on', musicOn);
        }
        syncMusic();

        el.btnMusic.addEventListener('click', function() {
            musicOn = !musicOn;
            try {
                localStorage.setItem('pk_music_on', musicOn ? '1' : '0');
            } catch (e) {}
            syncMusic();
            initAudio(); // ساخت/ادامه AudioContext (نیاز به تعامل کاربر)
            if (musicOn) MusicEngine.start();
            else MusicEngine.stop();
        });

        var R = null,
            cv = null,
            scene = null,
            camera = null,
            skyMesh = null,
            sun = null,
            sunSpr = null,

               generateMipmaps=false + NearestFilter = پیکسلی مثل ماینکرافت و سریع. */
            var TexCache = {};

            function tx(name, p) {

            function rn(a) {

        function makeCharacter() {

            function M(t) {

            g.add(bd);

            function lm(mt, w, h, px, py) {
                var pv = new THREE.Group();
                pv.position.set(px, py, 0);
                var m = new THREE.Mesh(box, mt);
                m.scale.set(w, h, w);
                m.position.y = -h / 2;
                pv.add(m);
                g.add(pv);
                return pv;
            }
            CP.ll = lm(pn, .24, .73, -.13, .73);
            CP.lr = lm(pn, .24, .73, .13, .73);
            CP.al = lm(sh, .2, .66, -.36, 1.28);
            CP.ar = lm(sh, .2, .66, .36, 1.28);
            g.traverse(function(o) {
                if (o.isMesh) o.castShadow = true;
            });
            scene.add(g);
            PM = g;
        }

        function addBlock(x, y, z, type, plat, sol) {
            if (sol === undefined) sol = true;
            if (type === 'pha') sol = phaIsSolid();
            var m = new THREE.Mesh(BG, mats[type]);
            m.position.set(x + .5, y + .5, z + .5);
            m.castShadow = m.receiveShadow = true;
            m.visible = sol;
            scene.add(m);
            var k = x + ',' + y + ',' + z;
            if (sol) BM.set(k, {
                plat: plat,
                type: type,
                mesh: m
            });
            if (type === 'pha') phantoms.push({
                key: k,
                bx: x,
                by: y,
                bz: z,
                plat: plat,
                mesh: m
            });
            return {
                mesh: m,
                key: k
            };
        }

        function addCoin(x, y, z, plat) {
            var g = new THREE.Group();
            var m = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .09, 14), coinMat);
            m.rotation.x = Math.PI / 2;
            m.castShadow = true;
            g.add(m);
            g.position.set(x, y, z);
            scene.add(g);
            coinsArr.push({
                mesh: g,
                x: x,
                y: y,
                z: z,
                plat: plat,
                ph: Math.random() * 6.28
            });
        }

        function addFlag(bx, ny, bz, arr) {
            var p = new THREE.Mesh(new THREE.BoxGeometry(.09, 2.1, .09), mats.gold);
            p.position.set(bx + .15, ny + 1.05, bz + .15);
            p.castShadow = true;
            var f = new THREE.Mesh(new THREE.PlaneGeometry(.75, .45), new THREE.MeshLambertMaterial({
                color: 0xe33b3b,
                side: THREE.DoubleSide
            }));
            f.position.set(bx + .57, ny + 1.8, bz + .15);
            scene.add(p);
            scene.add(f);
            arr.push({
                mesh: p,
                key: null
            }, {
                mesh: f,
                key: null
            });
        }

        function movReg(m) {
            if (!m || !m.keys) return;
            for (var i = 0; i < m.keys.length; i++) BM.delete(m.keys[i]);
            m.keys = [];
            for (var j = 0; j < m.ent.length; j++) {
                var e = m.ent[j];
                var k = (m.sx + e.dx) + ',' + m.y + ',' + (m.z + e.dz);
                BM.set(k, {
                    plat: m.plat,
                    type: 'mov',
                    mesh: null
                });
                m.keys.push(k);
            }
        }

        function genPlat(i) {
            var t = Math.min(i / 28, 1),
                pv = plats[plats.length - 1];
            var sp = null;
            if (i >= 8 && Math.random() < .12 + .08 * t) sp = 'moving';
            else if (i >= 6) {
                var r = Math.random();
                if (r < .10) sp = 'ice';
                else if (r < .19) sp = 'slime';
                else if (r < .27) sp = 'break';
                else if (r < .34) sp = 'jump';
                else if (i >= 8 && r < .41) sp = 'glass';
                else if (i >= 10 && r < .47) sp = 'phantom';
            }
            if (sp && i % 10 === 0 && (sp === 'phantom' || sp === 'glass')) sp = null;
            var dy = 0;
            if (i >= 3) {
                var r2 = Math.random(),
                    dp = .3 + .25 * t;
                if (sp === 'moving') dy = Math.random() < .5 ? 0 : -1;
                else if (r2 < .15) dy = 1;
                else if (r2 < .15 + dp) dy = -(1 + (Math.random() * (1 + Math.round(2 * t)) | 0));
                else dy = 0;
            }
            var ny = Math.max(5, Math.min(22, pv.y + dy));
            dy = ny - pv.y;
            var tm = {
                ice: 'ice',
                slime: 'slime',
                break: 'brk',
                moving: 'mov',
                jump: 'jp',
                glass: 'glass',
                phantom: 'pha'
            };

            if (gameMode === '2D') {
                var gap2 = Math.max(1, Math.round(1 + Math.random() * (2 + Math.floor(t * 3))));
                var w2 = Math.max(1, Math.round(2.5 - t * 1.5 - Math.random() * 1));
                if (sp === 'glass' || sp === 'phantom') w2 = Math.max(2, w2);
                var d2 = 2;
                var x2 = pv.x + pv.w + gap2;
                var z2 = 0;
                var type2 = sp ? tm[sp] : surfPool()[Math.random() * surfPool().length | 0];
                var ms2 = [];
                var mv2 = null;
                if (sp === 'moving') {
                    w2 = 2;
                    mv2 = {
                        plat: i,
                        y: ny,
                        z: z2,
                        w: w2,
                        d: d2,
                        bx: x2,
                        cx: x2,
                        sx: x2,
                        ph: Math.random() * 6.28,
                        spd: .8 + Math.random() * .7 + t * .7,
                        amp: 1 + Math.random() * .6 + t * .4,
                        ent: [],
                        meshes: [],
                        keys: []
                    };
                    for (var a = 0; a < w2; a++)
                        for (var b = 0; b < d2; b++) {
                            var m = new THREE.Mesh(BG, mats.mov);
                            m.castShadow = m.receiveShadow = true;
                            m.position.set(x2 + a + .5, ny + .5, z2 + b + .5);
                            scene.add(m);
                            mv2.ent.push({
                                dx: a,
                                dz: b
                            });
                            mv2.meshes.push(m);
                        }
                    movers.push(mv2);
                    movReg(mv2);
                } else {
                    for (var a = 0; a < w2; a++)
                        for (var b = 0; b < d2; b++) {
                            ms2.push(addBlock(x2 + a, ny, z2 + b, type2, i));
                            if (type2 !== 'pha') ms2.push(addBlock(x2 + a, ny - 1, z2 + b, 'stone', i));
                        }
                    if (Math.random() < .65) addCoin(x2 + (Math.random() * w2 | 0) + .5, ny + 1.25, z2 + 1, i);
                    if (i % 10 === 0) addFlag(x2, ny, z2, ms2);
                }
                plats.push({
                    index: i,
                    x: x2,
                    y: ny,
                    z: z2,
                    w: w2,
                    d: d2,
                    meshes: ms2,
                    mover: mv2
                });
                npi = i + 1;
                return;
            }

            // استخر بلاک‌های سطحی بر اساس بایوم فعلی (بلاک‌های جدید ماینکرافتی)
            function surfPool() {
                var b = Env.biome;
                if (b === 1) return ['snow', 'snow', 'stone', 'cobble', 'plank', 'ice'];
                if (b === 2) return ['netherrack', 'netherrack', 'obsidian', 'glowstone', 'cobble', 'stone'];
                return ['grass', 'grass', 'stone', 'plank', 'sand', 'log', 'cobble', 'glowstone'];
            }
            // بلوک زیرین متناسب با نوع سطح
            function underOf(tp) {
                if (tp === 'grass' || tp === 'snow') return 'dirt';
                if (tp === 'netherrack' || tp === 'obsidian') return tp;
                return 'stone';
            }
            var mg = sp === 'moving' ? 2 : dy === 1 ? 1 : dy === 0 ? (t < .4 ? 2 : 3) : dy === -1 ? 3 : 4;
            var gap = Math.max(1, Math.round(1 + Math.random() * (mg - 1) * (.35 + .65 * t)));
            var w = Math.max(1, Math.round(2.7 - t * 1.5 - Math.random() * .7)),
                d = Math.random() < .5 * t ? 1 : 2;
            if (sp === 'ice') {
                w = Math.max(2, w);
                d = 2;
            }
            if (sp === 'break') d = Math.max(2, d);
            if (sp === 'glass') {
                w = Math.max(2, w);
                d = Math.max(2, d);
            }
            if (sp === 'phantom') {
                w = Math.max(2, w);
                d = 2;
            }
            var x = Math.max(-8, Math.min(8, pv.x + Math.round((Math.random() - .5) * (1 + 2 * t)))),
                z = pv.z + pv.d + gap;
            var type = sp ? tm[sp] : surfPool()[Math.random() * surfPool().length | 0];
            var ms3 = [],
                mv = null;
            if (sp === 'moving') {
                w = 2;
                mv = {
                    plat: i,
                    y: ny,
                    z: z,
                    w: w,
                    d: d,
                    bx: x,
                    cx: x,
                    sx: x,
                    ph: Math.random() * 6.28,
                    spd: .8 + Math.random() * .7 + t * .7,
                    amp: 1 + Math.random() * .6 + t * .4,
                    ent: [],
                    meshes: [],
                    keys: []
                };
                for (var a = 0; a < w; a++)
                    for (var b = 0; b < d; b++) {
                        var m = new THREE.Mesh(BG, mats.mov);
                        m.castShadow = m.receiveShadow = true;
                        m.position.set(x + a + .5, ny + .5, z + b + .5);
                        scene.add(m);
                        mv.ent.push({
                            dx: a,
                            dz: b
                        });
                        mv.meshes.push(m);
                    }
                movers.push(mv);
                movReg(mv);
            } else {
                for (var a = 0; a < w; a++)
                    for (var b = 0; b < d; b++) {
                        ms3.push(addBlock(x + a, ny, z + b, type, i));
                        if (type !== 'pha') ms3.push(addBlock(x + a, ny - 1, z + b, underOf(type), i));
                    }
                if (Math.random() < .65) addCoin(x + (Math.random() * w | 0) + .5, ny + 1.25, z + (Math.random() * d | 0) + .5, i);
                if (i % 10 === 0) addFlag(x, ny, z, ms3);
            }
            plats.push({
                index: i,
                x: x,
                y: ny,
                z: z,
                w: w,
                d: d,
                meshes: ms3,
                mover: mv
            });
            npi = i + 1;
        }

        function buildStart() {
            var ms2 = [];
            if (gameMode === '2D') {
                var y0 = 10;
                for (var x = 0; x <= 6; x++)
                    for (var z = 0; z <= 1; z++) {
                        ms2.push(addBlock(x, y0, z, 'grass', 0));
                        ms2.push(addBlock(x, y0 - 1, z, 'dirt', 0));
                    }
                plats.push({
                    index: 0,
                    x: 0,
                    y: y0,
                    z: 0,
                    w: 7,
                    d: 2,
                    meshes: ms2,
                    mover: null
                });
            } else {
                var y0 = 10;
                for (var x = -3; x <= 3; x++)
                    for (var z = 0; z <= 6; z++) {
                        ms2.push(addBlock(x, y0, z, 'grass', 0));
                        ms2.push(addBlock(x, y0 - 1, z, 'dirt', 0));
                    }
                plats.push({
                    index: 0,
                    x: -3,
                    y: y0,
                    z: 0,
                    w: 7,
                    d: 7,
                    meshes: ms2,
                    mover: null
                });
                var px2 = [-3, 3],
                    pz2 = [0, 2];
                for (var pi = 0; pi < 2; pi++)
                    for (var qi = 0; qi < 2; qi++)
                        for (var h = 1; h <= 3; h++) ms2.push(addBlock(px2[pi], y0 + h, pz2[qi], 'stone', 0));
                for (var x = -3; x <= 3; x++)
                    for (var z = 0; z <= 2; z++) ms2.push(addBlock(x, y0 + 4, z, 'stone', 0));
                ms2.push(addBlock(0, y0 + 5, 1, 'gold', 0));
            }
        }

        function removePlat(p) {
            if (!p || !p.meshes) return;
            for (var i = 0; i < p.meshes.length; i++) {
                var e = p.meshes[i];
                if (e && e.mesh) scene.remove(e.mesh);
                if (e && e.key) {
                    BM.delete(e.key);
                    breakT.delete(e.key);
                }
            }
            if (p.mover) {
                if (p.mover.keys) {
                    for (var j = 0; j < p.mover.keys.length; j++) BM.delete(p.mover.keys[j]);
                }
                if (p.mover.meshes) {
                    for (var k2 = 0; k2 < p.mover.meshes.length; k2++) scene.remove(p.mover.meshes[k2]);
                }
                var ix = movers.indexOf(p.mover);
                if (ix >= 0) movers.splice(ix, 1);
            }
            phantoms = phantoms.filter(function(pb) {
                return pb.plat !== p.index;
            });
            coinsArr = coinsArr.filter(function(c) {
                if (c.plat === p.index) {
                    scene.remove(c.mesh);
                    return false;
                }
                return true;
            });
        }

        function ensureWorld(cur) {
            while (npi < cur + 8) genPlat(npi);
            var kf = Math.min(cur - 4, checkpoint ? checkpoint.plat : cur - 4);
            while (plats.length && plats[0].index < kf) removePlat(plats.shift());
        }

        function resetWorld() {
            for (var i = 0; i < plats.length; i++) removePlat(plats[i]);
            plats = [];
            movers = [];
            coinsArr = [];
            falling = [];
            phantoms = [];
            phClock = 0;
            phaLastSolid = true;
            breakT.clear();
            BM.clear();
            npi = 1;
            buildStart();
            for (var j = 1; j < 8; j++) genPlat(j);
        }

        var PW = .3,
            PH = 1.8,
            GV = 28,
            JV = 8.4,
            SP = 5.6,
            GRD_AC = 70,
            AIR_AC = 25,
            ICE_AC = 6.5,
            ICE_DC = .9,
            BRK_T = 1,
            GLASS_T = 2,
            JP_MULT = 3,
            PHA_SOLID_T = 2.4,
            PHA_GONE_T = 2.4,
            PHA_WARN_T = .8;

        function collides(px, py, pz) {
            var x0 = Math.floor(px - PW),
                x1 = Math.floor(px + PW),
                y0 = Math.floor(py),
                y1 = Math.floor(py + PH - .001),
                z0 = Math.floor(pz - PW),
                z1 = Math.floor(pz + PW);
            for (var x = x0; x <= x1; x++)
                for (var y = y0; y <= y1; y++)
                    for (var z = z0; z <= z1; z++)
                        if (BM.has(x + ',' + y + ',' + z)) return true;
            return false;
        }

        function probe(py) {
            var y = Math.floor(py);
            for (var a = 0; a < 2; a++)
                for (var b = 0; b < 2; b++) {
                    var ox = a ? -0.25 : 0.25,
                        oz = b ? -0.25 : 0.25;
                    var k = Math.floor(P.pos.x + ox) + ',' + y + ',' + Math.floor(P.pos.z + oz);
                    var v = BM.get(k);
                    if (v) return v;
                }
            return null;
        }

        function tryJump() {
            if (state !== 'playing') return;
            if (P.og) {
                P.vel.y = JV;
                P.og = false;
                jumpCount = 0;
                sfx('j');
            } else if (unlocked && jumpCount < 1) {
                P.vel.y = JV * .95;
                jumpCount = 1;
                sfx('dj');
            } else jumpBuf = .12;
        }

        function updMovers(dt) {
            for (var i = 0; i < movers.length; i++) {
                var m = movers[i];
                if (!m || !m.meshes) continue;
                m.ph += dt * m.spd;
                var pc = m.cx;
                m.cx = m.bx + Math.sin(m.ph) * m.amp;
                var ns = Math.round(m.cx);
                if (ns !== m.sx) {
                    m.sx = ns;
                    movReg(m);
                }
                for (var k = 0; k < m.meshes.length; k++) m.meshes[k].position.x = m.cx + m.ent[k].dx + .5;
                if (P.og) {
                    var pu = probe(P.pos.y - .05);
                    if (pu && pu.plat === m.plat) P.pos.x += m.cx - pc;
                }
            }
        }

        function collapseB(key) {
            var info = BM.get(key);
            if (!info || !info.mesh) return;
            var wasGlass = info.type === 'glass';
            BM.delete(key);
            breakT.delete(key);
            falling.push({
                mesh: info.mesh,
                vy: 0,
                t: 0,
                rx: (Math.random() - .5) * 4,
                rz: (Math.random() - .5) * 4
            });
            // ذرات خرده‌شیشه/خرده‌سنگ (از استخر؛ بدون ساخت آبجکت)
            var mp = info.mesh.position;
            FX.burst(mp.x, mp.y, mp.z, wasGlass ? 0xaef0ff : 0xd8c07a, wasGlass ? 12 : 8, 3.2, 9, .55);
            sfx(wasGlass ? 'gs' : 'br');
        }

        function phaPeriod() {
            return PHA_SOLID_T + PHA_GONE_T;
        }

        function phaIsSolid() {
            return (phClock % phaPeriod()) < PHA_SOLID_T;
        }

        function overlapPlayer(bx, by, bz) {
            return bx < P.pos.x + PW && bx + 1 > P.pos.x - PW &&
                by < P.pos.y + PH && by + 1 > P.pos.y &&
                bz < P.pos.z + PW && bz + 1 > P.pos.z - PW;
        }

        function doLaunch() {
            P.vel.y = JV * JP_MULT;
            P.og = false;
            jumpCount = 0;
            jumpBuf = 0;
            shakeAmt = Math.max(shakeAmt, .3);
            sfx('jp');
        }

        function updPhantoms(dt) {
            phClock += dt;
            if (!phantoms.length) {
                phaLastSolid = phaIsSolid();
                return;
            }
            var per = phaPeriod(),
                phz = phClock % per,
                solid = phz < PHA_SOLID_T,
                warn = !solid && phz > per - PHA_WARN_T,
                blink = warn && ((phz * 9 | 0) % 2 === 0);
            for (var i = 0; i < phantoms.length; i++) {
                var pb = phantoms[i];
                if (!pb || !pb.mesh) continue;
                var isSol = BM.has(pb.key);
                if (solid && !isSol) {
                    if (!overlapPlayer(pb.bx, pb.by, pb.bz))
                        BM.set(pb.key, {
                            plat: pb.plat,
                            type: 'pha',
                            mesh: pb.mesh
                        });
                    pb.mesh.visible = true;
                } else if (!solid && isSol) {
                    BM.delete(pb.key);
                    pb.mesh.visible = blink;
                } else {
                    pb.mesh.visible = solid || blink;
                }
            }
            if (solid !== phaLastSolid) {
                phaLastSolid = solid;
                var nd = 1e9;
                for (var j = 0; j < phantoms.length; j++) {
                    var q = phantoms[j];
                    if (!q || !q.mesh) continue;
                    var dx = q.bx + .5 - P.pos.x,
                        dyq = q.by + .5 - (P.pos.y + .9),
                        dz = q.bz + .5 - P.pos.z,
                        dd = dx * dx + dyq * dyq + dz * dz;
                    if (dd < nd) nd = dd;
                }
                if (nd < 225) sfx(solid ? 'pa' : 'pv');
            }
        }

        function collectC(i) {
            var c = coinsArr[i];
            FX.burst(c.x, c.y, c.z, 0xffd94a, 10, 2.8, 2.5, .5); // برق سکه
            scene.remove(c.mesh);
            coinsArr.splice(i, 1);
            coinsTotal++;
            sfx('co');
            saveData();
            if (!unlocked && coinsTotal >= 30) {
                unlocked = true;
                shieldCharges = 1;
                sfx('ul');
                saveData();
                toast('🎉 ۳۰ سکه! پرش دوبل و سپر فعال شد!');
            }
            updHUD();
        }

        function updateScoreAndCheckpoint(platIndex) {
            if (platIndex > score) {
                score = platIndex;
                Env.setBiome(Math.floor(score / 100)); // تغییر بایوم هر ۱۰۰ امتیاز
                updHUD();
                sfx('sc');
                if (score > best) {
                    best = score;
                    saveData();
                }
                if (score % 10 === 0) {
                    var pl = null;
                    for (var i = 0; i < plats.length; i++)
                        if (plats[i].index === score) {
                            pl = plats[i];
                            break;
                        }
                    if (pl) {
                        checkpoint = {
                            plat: score,
                            score: score,
                            pos: new THREE.Vector3(pl.x + pl.w / 2, pl.y + 1.01, pl.z + pl.d / 2)
                        };
                        sfx('cp');
                        toast('🚩 چک‌پوینت!');
                    }
                }
                ensureWorld(platIndex);
            }
        }

        function physStep(dt) {
            updMovers(dt);
            updPhantoms(dt);
            var gi = P.og ? probe(P.pos.y - .05) : null,
                icy = gi && gi.type === 'ice';

            if (gameMode === '2D') {
                var ix2 = inp.x;
                if (ix2 > 1) ix2 = 1;
                if (ix2 < -1) ix2 = -1;
                var ac2 = P.og ? (icy ? (Math.abs(ix2) > .01 ? ICE_AC : ICE_DC) : GRD_AC) : AIR_AC;
                P.vel.x += (ix2 * SP - P.vel.x) * Math.min(1, ac2 * dt);
                P.vel.z = 0;
            } else {
                var ix = inp.x,
                    iz = inp.y,
                    l = Math.hypot(ix, iz);
                if (l > 1) {
                    ix /= l;
                    iz /= l;
                }
                var sy = Math.sin(yaw),
                    cy = Math.cos(yaw),
                    mx = -sy * iz + cy * ix,
                    mz = -cy * iz - sy * ix;
                var ac = P.og ? (icy ? (l > .01 ? ICE_AC : ICE_DC) : GRD_AC) : AIR_AC;
                P.vel.x += (mx * SP - P.vel.x) * Math.min(1, ac * dt);
                P.vel.z += (mz * SP - P.vel.z) * Math.min(1, ac * dt);
            }

            if (jumpBuf > 0 && P.og) {
                P.vel.y = JV;
                P.og = false;
                jumpCount = 0;
                jumpBuf = 0;
                sfx('j');
            }
            jumpBuf -= dt;
            P.vel.y = Math.max(P.vel.y - GV * dt, -40);

            var nx = P.pos.x + P.vel.x * dt;
            if (collides(nx, P.pos.y, P.pos.z)) P.vel.x = 0;
            else P.pos.x = nx;

            if (gameMode !== '2D') {
                var nz = P.pos.z + P.vel.z * dt;
                if (collides(P.pos.x, P.pos.y, nz)) P.vel.z = 0;
                else P.pos.z = nz;
            }

            var ny = P.pos.y + P.vel.y * dt;
            if (collides(P.pos.x, ny, P.pos.z)) {
                if (P.vel.y < 0) {
                    var hit = probe(ny);
                    if (hit && hit.type === 'slime' && P.vel.y < -3) {
                        P.vel.y = 10.5;
                        jumpCount = 0;
                        shakeAmt = Math.max(shakeAmt, .2);
                        sfx('bo');
                        updateScoreAndCheckpoint(hit.plat);
                    } else if (hit && hit.type === 'jp' && P.vel.y < -.5) {
                        doLaunch();
                        updateScoreAndCheckpoint(hit.plat);
                    } else {
                        if (P.vel.y < -12) sfx('la');
                        if (P.vel.y < -9) shakeAmt = Math.max(shakeAmt, Math.min(.4, (-P.vel.y - 8) * .05));
                        if (P.vel.y < -7) FX.burst(P.pos.x, ny, P.pos.z, 0xcfc4a8, 7, 2.2, 4, .45); // گردوخاک فرود
                        var sn = Math.floor(ny) + 1;
                        if (!collides(P.pos.x, sn, P.pos.z)) P.pos.y = sn;
                        P.og = true;
                        jumpCount = 0;
                    }
                }
                if (P.og) P.vel.y = 0;
                else P.vel.y = Math.max(P.vel.y, 0);
            } else {
                P.pos.y = ny;
                P.og = false;
            }

            if (P.og) {
                var gb = probe(P.pos.y - .05);
                if (gb && (gb.type === 'brk' || gb.type === 'glass') && !breakT.has(gb.key)) {
                    breakT.set(gb.key, gb.type === 'glass' ? GLASS_T : BRK_T);
                    sfx(gb.type === 'glass' ? 'gc' : 'cr');
                }
                if (gb && gb.type === 'jp') doLaunch();
                if (gb && gb.plat !== lastPlat) {
                    lastPlat = gb.plat;
                    updateScoreAndCheckpoint(gb.plat);
                }
            }

            var keysArr = Array.from(breakT.keys());
            for (var bi = 0; bi < keysArr.length; bi++) {
                var kk = keysArr[bi],
                    tv = breakT.get(kk),
                    nv = tv - dt;
                if (nv <= 0) collapseB(kk);
                else breakT.set(kk, nv);
            }

            for (var ci = coinsArr.length - 1; ci >= 0; ci--) {
                var c = coinsArr[ci];
                var dx = c.x - P.pos.x,
                    dy2 = c.y - (P.pos.y + .9),
                    dz = c.z - P.pos.z;
                if (dx * dx + dy2 * dy2 + dz * dz < 1.15) collectC(ci);
            }

            var my = 1e9;
            for (var pi = 0; pi < plats.length; pi++)
                if (plats[pi].y < my) my = plats[pi].y;
            if (P.pos.y < my - 9) fallOut();
        }

        function initAudio() {
            if (!audioStarted) {
                audioStarted = true;
                try {
                    actx = new(window.AudioContext || window.webkitAudioContext)();
                    master = actx.createGain();
                    master.gain.value = .45;
                    master.connect(actx.destination);
                } catch (e) {}
            }
            if (actx && actx.state === 'suspended') actx.resume();
            if (actx && musicOn) MusicEngine.start(); // موزیک مستقل از soundOn (فقط SFX به soundOn وابسته است)
        }

        function tn(f0, f1, dur, vol, type, off) {
            if (!actx) return;
            var t = actx.currentTime + (off || 0),
                o = actx.createOscillator(),
                g = actx.createGain();
            o.type = type || 'sine';
            o.frequency.setValueAtTime(f0, t);
            if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(.001, t + dur);
            o.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + dur + .05);
        }

        function sfx(k) {

            else if (k === 'la') tn(150, 70, .1, .12, 'triangle');
            else if (k === 'sc') tn(880, 0, .22, .08);
            else if (k === 'co') {
                tn(988, 0, .08, .1);
                tn(1319, 0, .18, .1, 'sine', .07);
            } else if (k === 'cp') {
                tn(659, 0, .12, .1);
                tn(880, 0, .25, .1, 'sine', .12);
            } else if (k === 'bo') tn(180, 520, .18, .14);
            else if (k === 'br') tn(220, 80, .14, .13, 'square');
            else if (k === 'cr') tn(700, 500, .05, .05, 'square');
            else if (k === 'ul') {
                tn(523, 0, .15, .1);
                tn(659, 0, .15, .1, 'sine', .13);
                tn(784, 0, .15, .1, 'sine', .26);
                tn(1047, 0, .4, .1, 'sine', .39);
            } else if (k === 'di') tn(300, 60, .6, .14, 'sawtooth');
            else if (k === 'gc') {
                tn(950, 700, .05, .05, 'square');
                tn(1300, 950, .05, .04, 'square', .06);
            } else if (k === 'gs') {
                tn(1900, 900, .09, .08, 'square');
                tn(1450, 700, .08, .07, 'square', .03);
                tn(2300, 1100, .07, .06, 'square', .06);
                tn(520, 120, .18, .09, 'triangle');
            } else if (k === 'jp') {
                tn(140, 720, .3, .16);
                tn(280, 940, .22, .07, 'triangle');
            } else if (k === 'pv') tn(640, 160, .32, .05, 'triangle');
            else if (k === 'pa') {

        }

        var _v1 = new THREE.Vector3(),

        function updCamera(dt) {
            if (gameMode === '2D') {
                var targetX = P.pos.x;
                var targetY = P.pos.y + 1.62;
                camera.position.set(targetX, targetY, P.pos.z + 10);
                camera.lookAt(targetX, targetY, P.pos.z);
                if (shakeAmt > .002) {
                    camera.position.x += (Math.random() - .5) * shakeAmt;
                    camera.position.y += (Math.random() - .5) * shakeAmt;
                    shakeAmt *= Math.exp(-7 * dt);
                } else shakeAmt = 0;

            }

            _v1.set(P.pos.x, P.pos.y + 1.62, P.pos.z);
            var cp = Math.cos(pit),
                sp = Math.sin(pit);
            _v2.set(-Math.sin(yaw) * cp, sp, -Math.cos(yaw) * cp);
            var third = thirdPerson || state !== 'playing';
            PM.visible = third;
            if (third) {
                camera.position.copy(_v1).addScaledVector(_v2, -4.1);
                camera.position.y += .4;
                camera.lookAt(_v3.copy(_v1).addScaledVector(_v2, 3));
            } else {
                camera.position.copy(_v1);
                camera.rotation.y = yaw;
                camera.rotation.x = pit;
            }
            if (shakeAmt > .002) {
                camera.position.x += (Math.random() - .5) * shakeAmt;
                camera.position.y += (Math.random() - .5) * shakeAmt;
                camera.position.z += (Math.random() - .5) * shakeAmt;
                shakeAmt *= Math.exp(-7 * dt);
            } else shakeAmt = 0;
            skyMesh.position.copy(camera.position);
            sunSpr.position.set(camera.position.x + 120, camera.position.y + 170, camera.position.z + 320);
            sun.position.set(P.pos.x + 60, P.pos.y + 90, P.pos.z + 40);
            sun.target.position.copy(P.pos);
            sun.target.updateMatrixWorld();

        /* ===================== جلوه‌های بصری بهینه (FX) =====================
           - همه ذرات از «یک» استخر ثابت با بافر ازپیش‌تخصیص‌یافته استفاده
             می‌کنند؛ در حین بازی هیچ Object/Geometry/Material ساخته نمی‌شود.
           - کل سیستم ذرات فقط «یک» THREE.Points و در نتیجه یک draw call است. */
        var slowmoT = 0,
            trailAcc = 0;
        var FX = (function() {
            var MAX = 140,
                pts = null;
            var pos, col, vel, life, mlife, grv, bcol, head = 0,
                _c = null;

            function ensure() {
                if (pts || !scene) return;
                var i;
                pos = new Float32Array(MAX * 3);
                col = new Float32Array(MAX * 3);
                bcol = new Float32Array(MAX * 3);
                vel = new Float32Array(MAX * 3);
                life = new Float32Array(MAX);
                mlife = new Float32Array(MAX);
                grv = new Float32Array(MAX);
                for (i = 0; i < MAX; i++) pos[i * 3 + 1] = -9999;
                var geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
                var dc = document.createElement('canvas');
                dc.width = dc.height = 32;
                var dg = dc.getContext('2d'),
                    dgr = dg.createRadialGradient(16, 16, 1, 16, 16, 15);
                dgr.addColorStop(0, 'rgba(255,255,255,1)');
                dgr.addColorStop(.4, 'rgba(255,255,255,.55)');
                dgr.addColorStop(1, 'rgba(255,255,255,0)');
                dg.fillStyle = dgr;
                dg.fillRect(0, 0, 32, 32);
                pts = new THREE.Points(geo, new THREE.PointsMaterial({
                    size: .42,
                    map: new THREE.CanvasTexture(dc),
                    transparent: true,
                    vertexColors: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending
                }));
                pts.frustumCulled = false;
                scene.add(pts);
                _c = new THREE.Color();
            }

            function emit(x, y, z, vx, vy, vz, hex, l, g) {
                ensure();
                if (!pts) return;
                head = (head + 1) % MAX;
                var i3 = head * 3;
                pos[i3] = x;
                pos[i3 + 1] = y;
                pos[i3 + 2] = z;
                vel[i3] = vx;
                vel[i3 + 1] = vy;
                vel[i3 + 2] = vz;
                _c.setHex(hex);
                bcol[i3] = _c.r;
                bcol[i3 + 1] = _c.g;
                bcol[i3 + 2] = _c.b;
                col[i3] = _c.r;
                col[i3 + 1] = _c.g;
                col[i3 + 2] = _c.b;
                life[head] = l;
                mlife[head] = l;
                grv[head] = g;
            }
            // ترکیدن ذرات (شیشه/سکه/فرود)
            function burst(x, y, z, hex, n, spd, g, l) {
                for (var k = 0; k < n; k++) {
                    var a = Math.random() * 6.283,
                        s = spd * (.4 + Math.random() * .8);
                    emit(x, y, z, Math.cos(a) * s, Math.abs(Math.random() - .3) * s + .5, Math.sin(a) * s, hex, l * (.6 + Math.random() * .7), g);
                }
            }
            // دنباله نورانی هنگام سرعت زیاد
            function trail(p) {
                emit(p.pos.x + (Math.random() - .5) * .3, p.pos.y + .8 + (Math.random() - .5) * .3, p.pos.z + (Math.random() - .5) * .3, (Math.random() - .5) * .4, .3, (Math.random() - .5) * .4, Math.random() < .5 ? 0x66eaff : 0xbfefff, .45, 0);
            }

            function update(dt) {
                ensure();
                if (!pts) return;
                var i, i3, f;
                for (i = 0; i < MAX; i++) {
                    if (life[i] > 0) {
                        life[i] -= dt;
                        i3 = i * 3;
                        vel[i3 + 1] -= grv[i] * dt;
                        pos[i3] += vel[i3] * dt;
                        pos[i3 + 1] += vel[i3 + 1] * dt;
                        pos[i3 + 2] += vel[i3 + 2] * dt;
                        f = life[i] / mlife[i];
                        f *= f;
                        col[i3] = bcol[i3] * f;
                        col[i3 + 1] = bcol[i3 + 1] * f;
                        col[i3 + 2] = bcol[i3 + 2] * f;
                        if (life[i] <= 0) pos[i3 + 1] = -9999;
                    }
                }
                pts.geometry.attributes.position.needsUpdate = true;
                pts.geometry.attributes.color.needsUpdate = true;
            }
            return {
                burst: burst,
                trail: trail,
                update: update
            };
        })();

        /* ============ چرخه روز/شب + بایوم‌ها (فقط تغییر uniform/رنگ) ============ */
        var Env = (function() {
            var DAY_LEN = 160, // یک شبانه‌روز کامل ~۱۶۰ ثانیه
                dayT = .16,
                biomeIdx = -1,
                tintCur, tintTgt;
            // پالت زمان (شب / غروب / روز) برای افق-میانه-بالا
            var P_H = [0x101a33, 0xffc98a, 0xdff2ff],
                P_M = [0x0c1428, 0xe08a5a, 0x62a8f5],
                P_T = [0x05070f, 0x5a3a7a, 0x3f7ce0];
            // بایوم‌ها: چندرنگ‌کننده بلوک (روی map ضرب می‌شود)
            var BIOMES = [{
                name: 'آسمان',
                tint: 0xffffff
            }, {
                name: 'برفی',
                tint: 0xdfeaff
            }, {
                name: 'نذر',
                tint: 0xffb494
            }];
            var cH, cM, cT, tmpA;

            function sm(t, a, b) {
                t = Math.min(1, Math.max(0, (t - a) / (b - a)));
                return t * t * (3 - 2 * t);
            }
            // میکس سه‌رنگ بر اساس وزن غروب/روز
            function mix3(out, duskW, dayF, arr) {
                out.setHex(arr[0]);
                tmpA.setHex(arr[1]);
                out.lerp(tmpA, duskW);
                tmpA.setHex(arr[2]);
                out.lerp(tmpA, dayF * (1 - duskW * .6));
            }

            function setBiome(idx) {
                if (!tintCur) return;
                var nb = ((idx % BIOMES.length) + BIOMES.length) % BIOMES.length;
                if (nb === biomeIdx) return;
                biomeIdx = nb;
                tintTgt.setHex(BIOMES[nb].tint);
                toast('🌍 بایوم: ' + BIOMES[nb].name);
            }

            function applyTint() {
                if (!mats) return;
                var one = function(m) {
                    if (m && m.color) m.color.copy(tintCur);
                };
                one(mats.dirt);
                one(mats.stone);
                one(mats.plank);
                one(mats.sand);
                one(mats.leaves);
                one(mats.gold);
                one(mats.brk);
                one(mats.mov);
                one(mats.glass);
                one(mats.ice);
                one(mats.slime);
                one(mats.jp);
                one(mats.pha);
                one(mats.cobble);
                one(mats.glowstone);
                one(mats.netherrack);
                one(mats.obsidian);
                var i;
                if (mats.grass)
                    for (i = 0; i < mats.grass.length; i++) one(mats.grass[i]);
                if (mats.log)
                    for (i = 0; i < mats.log.length; i++) one(mats.log[i]);
            }

            function update(dt, cam) {
                if (!gameReady || !skyMesh) return;
                dayT = (dayT + dt / DAY_LEN) % 1;
                var e = Math.sin(dayT * Math.PI * 2), // ارتفاع خورشید
                    dayF = sm(e, -.12, .3),
                    duskW = Math.max(0, 1 - Math.abs(e) / .28) * .9;
                mix3(cH, duskW, dayF, P_H);
                mix3(cM, duskW, dayF, P_M);
                mix3(cT, duskW, dayF, P_T);
                var u = skyMesh.material.uniforms;
                u.uH.value.copy(cH);
                u.uM.value.copy(cM);
                u.uT.value.copy(cT);
                scene.fog.color.copy(cM);
                var hemi = null;
                scene.children.forEach(function(ch) {
                    if (ch.isHemisphereLight) hemi = ch;
                });
                if (hemi) {
                    hemi.color.copy(cH);
                    hemi.intensity = .35 + .55 * dayF;
                }
                sun.intensity = .25 + .85 * dayF;
                sun.color.setHex(e > -.1 ? 0xfff4d6 : 0x8899cc);
                // مدار خورشید/ماه دور دوربین (فقط position، هیچ ساختی ندارند)
                var ang = dayT * Math.PI * 2,
                    cd = Math.cos(ang);
                sunSpr.position.set(cam.position.x + cd * 300, cam.position.y + e * 260 + 20, cam.position.z - 180);
                sunSpr.material.opacity = Math.max(0, sm(e, -.15, .05));
                moonSpr.position.set(cam.position.x - cd * 300, cam.position.y - e * 260 + 20, cam.position.z - 180);
                moonSpr.material.opacity = Math.max(0, sm(-e, -.05, .3));
                if (starPts) {
                    starMat.opacity = sm(-e, .02, .35) * .95;
                    starPts.rotation.y += dt * .004;
                    starPts.position.copy(cam.position);
                }
                window.gameIsNight = e < -.05; // خوراک موزیک روز/شب
                // ترنزیشن نرم بایوم روی رنگ متریال‌ها (بدون بازسازی بافت)
                if (tintCur.getHex() !== tintTgt.getHex()) {
                    tintCur.lerp(tintTgt, Math.min(1, dt * 1.5));
                    applyTint();
                }
            }
            cH = new THREE.Color();
            cM = new THREE.Color();
            cT = new THREE.Color();
            tmpA = new THREE.Color();
            tintCur = new THREE.Color(0xffffff);
            tintTgt = new THREE.Color(0xffffff);
            window.Env = {
                setBiome: setBiome,
                update: update,
                get biome() {
                    return biomeIdx;
                }
            };
            return window.Env;
        })();

        function loop(now) {
            requestAnimationFrame(loop);
            var dt = Math.min((now - lastT) / 1000, .05);
            lastT = now;
            if (!gameReady) return;
            // اسلوموشن مرگ: مقیاس زمان برای دنیا (تایمر با زمان واقعی کم می‌شود)
            if (slowmoT > 0) {
                slowmoT -= dt;
                dt *= .22;
                if (slowmoT <= 0 && state === 'dying') finishDeath();
            }
            if (state === 'playing') {
                if (!touchMode) {
                    var k = pollKeys();
                    inp.x = k.x;
                    inp.y = k.y;
                } else if (joy.id === null) {
                    inp.x = 0;
                    inp.y = 0;
                }
                accum = Math.min(accum + dt, .25);
                var step = 1 / 120;
                while (accum >= step) {
                    physStep(step);
                    accum -= step;
                }
            } else if (state === 'menu' || state === 'device') {
                menuTime += dt;
                if (gameMode === '3D') {
                    yaw = menuTime * .3;
                    pit = -.22;
                } else {
                    yaw = 0;
                    pit = 0;
                }
            }
            var spd = Math.hypot(P.vel.x, P.vel.z);
            if (state === 'playing' && spd > .6) walkT += dt * (4 + spd);
            else walkT *= .85;
            var sw = P.og ? Math.sin(walkT) * .65 : .5;
            CP.ll.rotation.x = sw;
            CP.lr.rotation.x = -sw;
            CP.al.rotation.x = -sw * .7;
            CP.ar.rotation.x = sw * .7;
            PM.position.copy(P.pos);
            if (gameMode === '2D') {
                if (inp.x > 0.1) {
                    facingRight = true;
                } else if (inp.x < -0.1) {
                    facingRight = false;
                }
                PM.rotation.y = facingRight ? 0 : Math.PI;
            } else {
                if (spd > .6) {
                    var ta = Math.atan2(P.vel.x, P.vel.z);
                    var d = ta - PM.rotation.y;
                    while (d > Math.PI) d -= 6.28;
                    while (d < -Math.PI) d += 6.28;
                    PM.rotation.y += d * .15;
                }
            }
            for (var i = 0; i < clouds.length; i++) {
                var c = clouds[i];
                c.position.x += dt * 1.2;
                if (c.position.x > camera.position.x + 180) c.position.x -= 360;
                if (c.position.z < camera.position.z - 60) c.position.z += 360;
            }
            for (var fi = falling.length - 1; fi >= 0; fi--) {
                var f = falling[fi];
                f.vy -= 30 * dt;
                f.mesh.position.y += f.vy * dt;
                f.mesh.rotation.x += f.rx * dt;
                f.mesh.rotation.z += f.rz * dt;
                f.t += dt;
                if (f.t > 1.4) {
                    scene.remove(f.mesh);
                    falling.splice(fi, 1);
                }
            }
            for (var ci = 0; ci < coinsArr.length; ci++) {
                var cn = coinsArr[ci];
                cn.mesh.rotation.y += dt * 2.5;
                cn.mesh.position.y = cn.y + Math.sin(now * .002 + cn.ph) * .12;
            }
            // دنباله نورانی هنگام سرعت زیاد (نرخ ثابت، نه هر فریم)
            trailAcc -= dt;
            var spdTrail = Math.hypot(P.vel.x, P.vel.z);
            if (state === 'playing' && spdTrail > 7 && trailAcc <= 0) {
                trailAcc = .045;
                FX.trail(P);
            }
            updCamera(dt);
            FX.update(dt);
            Env.update(dt, camera);
            R.render(scene, camera);
        }

        document.body.classList.toggle('touch', touchMode);
        syncMenu();
        syncSound();
        updateModeUI();
        applyModeVisuals();
        openPanel(el.menu);
        if (gameReady) {
            resetWorld();
            requestAnimationFrame(loop);
        }
    </script>
</body>
