<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>پارکور علی سینا</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
         :root {
            --glass: rgba(15, 25, 45, .55)
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }
        
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: #87ceeb;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none
        }
        
        #game {
            position: fixed;
            inset: 0
        }
        
        .hidden {
            display: none!important
        }
        
        .panel {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(rgba(8, 18, 38, .45), rgba(8, 18, 38, .66));
            z-index: 30;
            padding: 20px;
            text-align: center;
            overflow-y: auto
        }
        
        h1 {
            color: #fff;
            font-size: min(9.5vw, 50px);
            font-weight: 900;
            text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 34px rgba(120, 200, 255, .55);
            margin-bottom: 4px
        }
        
        h2 {
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 3px 0 rgba(0, 0, 0, .35)
        }
        
        .sub {
            color: #eaf4ff;
            font-size: 15px;
            line-height: 2;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .6)
        }
        
        .btn {
            min-width: min(72vw, 300px);
            padding: 12px 22px;
            font-family: inherit;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(#6cc94f, #48a336);
            border: 3px solid rgba(0, 0, 0, .28);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0, 0, 0, .28);
            transition: transform .06s
        }
        
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, .28)
        }
        
        .btn.alt {
            background: linear-gradient(#5aa7e8, #3d7fc4)
        }
        
        .btn.gray {
            background: linear-gradient(#8a93a3, #666e7c)
        }
        
        .btn.gold {
            background: linear-gradient(#f5c542, #d9a520)
        }
        
        .chip {
            background: var(--glass);
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(6px)
        }
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
            z-index: 20;
            pointer-events: none
        }
        
        #hud .sp {
            flex: 1
        }
        
        .icobtn {
            pointer-events: auto;
            background: var(--glass);
            border: none;
            color: #fff;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit
        }
        
        #joyBase {
            position: fixed;
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .14);
            border: 2px solid rgba(255, 255, 255, .35);
            z-index: 25;
            display: none;
            pointer-events: none;
            transform: translate(-50%, -50%)
        }
        
        #joyKnob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .55);
            transform: translate(-50%, -50%)
        }
        
        #jumpBtn {
            position: fixed;
            right: 24px;
            bottom: 30px;
            width: 94px;
            height: 94px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .16);
            border: 2px solid rgba(255, 255, 255, .4);
            color: #fff;
            font-family: inherit;
            font-size: 20px;
            font-weight: 700;
            z-index: 25;
            display: none;
            pointer-events: auto
        }
        
        body.ingame.mode-touch #jumpBtn {
            display: block
        }
        
        .badge {
            background: #ffd54a;
            color: #5a4500;
            font-weight: 900;
            padding: 6px 16px;
            border-radius: 999px;
            font-size: 15px
        }
        
        #toast {
            position: fixed;
            top: 17%;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            background: var(--glass);
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 700;
            z-index: 40;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
            backdrop-filter: blur(6px);
            white-space: nowrap
        }
        
        #toast.on {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }
    </style>
</head>

<body>
    <div id="game"></div>

    <div id="hud" class="hidden">
        <div class="chip" id="scoreChip">امتیاز: ۰</div>
        <div class="chip" id="coinChip">🪙 ۰</div>
        <div class="chip" id="bestChip">رکورد: ۰</div>
        <div class="chip" id="powChip"></div>
        <div class="sp"></div>
        <button class="icobtn" id="viewBtn">👁 دید</button>
        <button class="icobtn" id="pauseBtn">⏸ توقف</button>
    </div>

    <div id="joyBase">
        <div id="joyKnob"></div>
    </div>
    <div id="jumpBtn">پرش</div>
    <div id="toast"></div>

    <div id="device" class="panel">
        <h1>پارکور علی سینا</h1>
        <div class="sub">روی چه دستگاهی بازی می‌کنی؟</div>
        <button class="btn" id="devTouch">📱 گوشی / تبلت</button>
        <button class="btn alt" id="devDesk">🖥 ویندوز / کامپیوتر</button>
    </div>

    <div id="menu" class="panel hidden">
        <h1>پارکور علی سینا</h1>
        <div class="sub" id="bestLine">بهترین رکورد: ۰</div>
        <div class="sub" id="coinLine"></div>
        <button class="btn" id="startBtn">▶ شروع بازی</button>
        <button class="btn alt" id="helpBtn">📖 راهنما</button>
        <button class="btn gray" id="soundBtn">🔊 صدا: روشن</button>
        <button class="btn gray" id="devChangeBtn">🔁 تغییر دستگاه</button>
    </div>

    <div id="help" class="panel hidden">
        <h2>راهنما</h2>
        <div class="sub" id="helpText"></div>
        <button class="btn alt" id="helpBack">بازگشت</button>
    </div>

    <div id="pause" class="panel hidden">
        <h2>⏸ توقف</h2>
        <button class="btn" id="resumeBtn">ادامه</button>
        <button class="btn alt" id="restartBtn">شروع دوباره</button>
        <button class="btn gray" id="pauseMenuBtn">منوی اصلی</button>
        <button class="btn gray" id="pauseDevBtn">🔁 تغییر دستگاه</button>
    </div>

    <div id="gameover" class="panel hidden">
        <h2>سقوط کردی! 💥</h2>
        <div class="sub">امتیاز: <b id="finalScore">۰</b><br>رکورد: <b id="goBest">۰</b></div>
        <div class="badge hidden" id="newRec">🎉 رکورد جدید!</div>
        <button class="btn gold" id="cpBtn">🚩 ادامه از چک‌پوینت</button>
        <button class="btn" id="retryBtn">🔄 شروع از اول</button>
        <button class="btn gray" id="goMenuBtn">منوی اصلی</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        'use strict';
        if (!window.THREE) {
            document.body.innerHTML = '<div style="color:#fff;padding:40px;font-family:Tahoma">خطا: Three.js بارگذاری نشد. اینترنت لازم است (یا three.min.js را کنار فایل بگذار).</div>';
            throw new Error('no THREE');
        }

        /* ---------- پایه ---------- */
        const toFa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹' [d]);
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const approach = (v, t, a) => v < t ? Math.min(v + a, t) : Math.max(v - a, t);

        function lerpAngle(a, b, t) {
            let d = b - a;
            while (d > Math.PI) d -= 2 * Math.PI;
            while (d < -Math.PI) d += 2 * Math.PI;
            return a + d * t;
        }
        let state = 'device',
            modeTouch = false,
            thirdPerson = true;
        let score = 0,
            best = 0,
            coinsTotal = 0,
            unlocked = false,
            runStartBest = 0,
            shieldCharges = 0;

        /* ---------- ذخیره: کوکی + localStorage ---------- */
        const SAVE = 'pas_save';

        function persist() {
            const d = JSON.stringify({
                best,
                coins: coinsTotal,
                unlocked
            });
            try {
                document.cookie = SAVE + '=' + encodeURIComponent(d) + ';max-age=31536000;path=/;SameSite=Lax';
            } catch (e) {}
            try {
                localStorage.setItem(SAVE, d);
            } catch (e) {}
        }

        function loadSave() {
            let d = null;
            const m = document.cookie.match(new RegExp('(?:^|; )' + SAVE + '=([^;]*)'));
            if (m) try {
                d = decodeURIComponent(m[1]);
            } catch (e) {}
            if (!d) {
                try {
                    d = localStorage.getItem(SAVE);
                } catch (e) {}
            }
            if (d) {
                try {
                    const o = JSON.parse(d);
                    best = o.best || 0;
                    coinsTotal = o.coins || 0;
                    unlocked = !!o.unlocked;
                } catch (e) {}
            }
            try {
                best = Math.max(best, +(localStorage.getItem('pk_best') || 0));
            } catch (e) {}
            if (coinsTotal >= 30) unlocked = true;
        }
        loadSave();

        /* ---------- سه‌بعدی ---------- */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0xd6ecff, 45, 120);
        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1200);
        camera.rotation.order = 'YXZ';
        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game').appendChild(renderer.domElement);
        const cv = renderer.domElement;

        scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x8a7f5a, 0.9));
        const sun = new THREE.DirectionalLight(0xfff4d6, 1.0);
        sun.castShadow = true;
        sun.shadow.mapSize.set(1024, 1024);
        sun.shadow.bias = -0.001;
        const sc = sun.shadow.camera;
        sc.left = -32;
        sc.right = 32;
        sc.top = 32;
        sc.bottom = -32;
        sc.near = 1;
        sc.far = 300;
        scene.add(sun);
        scene.add(sun.target);

        const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 16, 12), new THREE.ShaderMaterial({
            side: THREE.BackSide,
            depthWrite: false,
            vertexShader: 'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
            fragmentShader: 'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(0.33,0.60,0.98);vec3 mid=vec3(0.62,0.82,1.0);vec3 bot=vec3(0.88,0.95,1.0);vec3 c=mix(bot,mid,smoothstep(-0.05,0.25,h));c=mix(c,top,smoothstep(0.25,0.75,h));gl_FragColor=vec4(c,1.0);}'
        }));
        scene.add(sky);
        const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({
            fog: false,
            transparent: true,
            map: (() => {
                const c = document.createElement('canvas');
                c.width = c.height = 64;
                const g = c.getContext('2d');
                const gr = g.createRadialGradient(32, 32, 4, 32, 32, 30);
                gr.addColorStop(0, 'rgba(255,255,235,1)');
                gr.addColorStop(0.35, 'rgba(255,240,180,.9)');
                gr.addColorStop(1, 'rgba(255,240,180,0)');
                g.fillStyle = gr;
                g.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(c);
            })()
        }));
        sunSpr.scale.set(90, 90, 1);
        scene.add(sunSpr);

        const cloudTex = (() => {
            const c = document.createElement('canvas');
            c.width = c.height = 128;
            const g = c.getContext('2d');
            g.fillStyle = 'rgba(255,255,255,.95)';
            for (let i = 0; i < 14; i++) {
                g.beginPath();
                g.ellipse(20 + Math.random() * 88, 40 + Math.random() * 48, 14 + Math.random() * 18, 8 + Math.random() * 10, 0, 0, Math.PI * 2);
                g.fill();
            }
            return new THREE.CanvasTexture(c);
        })();
        const clouds = [];
        for (let i = 0; i < 12; i++) {
            const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
                map: cloudTex,
                transparent: true,
                opacity: .85,
                depthWrite: false,
                fog: false,
                side: THREE.DoubleSide
            }));
            const s = 18 + Math.random() * 26;
            m.scale.set(s, s * .55, 1);
            m.rotation.x = -Math.PI / 2;
            m.position.set((Math.random() - .5) * 320, 34 + Math.random() * 14, Math.random() * 320 - 40);
            scene.add(m);
            clouds.push(m);
        }

        /* ---------- تکسچرها ---------- */
        function tex(paint) {
            const c = document.createElement('canvas');
            c.width = c.height = 16;
            paint(c.getContext('2d'));
            const t = new THREE.CanvasTexture(c);
            t.magFilter = t.minFilter = THREE.NearestFilter;
            return t;
        }
        const rnd = a => a[(Math.random() * a.length) | 0];

        function fill(g, colors) {
            for (let y = 0; y < 16; y++)
                for (let x = 0; x < 16; x++) {
                    g.fillStyle = rnd(colors);
                    g.fillRect(x, y, 1, 1);
                }
        }
        const grassTop = tex(g => fill(g, ['#69c94e', '#5fbd45', '#54b03c', '#74d25a']));
        const dirtT = tex(g => fill(g, ['#9b7653', '#8a684a', '#a37e5b', '#7d5d42']));
        const grassSide = tex(g => {
            fill(g, ['#9b7653', '#8a684a', '#a37e5b', '#7d5d42']);
            for (let x = 0; x < 16; x++) {
                const h = 3 + ((Math.random() * 2) | 0);
                for (let y = 0; y < h; y++) {
                    g.fillStyle = rnd(['#69c94e', '#5fbd45', '#54b03c']);
                    g.fillRect(x, y, 1, 1);
                }
            }
        });
        const stoneT = tex(g => fill(g, ['#8f8f8f', '#9a9a9a', '#7e7e7e', '#a5a5a5', '#858585']));
        const plankT = tex(g => {
            fill(g, ['#b08e5a', '#a8854f', '#b99a66']);
            g.fillStyle = 'rgba(0,0,0,.18)';
            for (let y = 3; y < 16; y += 4) g.fillRect(0, y, 16, 1);
        });
        const sandT = tex(g => fill(g, ['#e7dca0', '#ded294', '#efe4ac', '#d8cc8c']));
        const logT = tex(g => {
            for (let x = 0; x < 16; x++) {
                const c = rnd(['#6b4f2e', '#7a5a35', '#5d4427', '#6f5231']);
                for (let y = 0; y < 16; y++) {
                    g.fillStyle = Math.random() < .1 ? rnd(['#5d4427', '#4f3a20']) : c;
                    g.fillRect(x, y, 1, 1);
                }
            }
        });
        const logTop = tex(g => {
            fill(g, ['#b09060', '#a5865a']);
            g.fillStyle = '#7a5a35';
            g.fillRect(2, 2, 12, 12);
            g.fillStyle = '#c4a575';
            g.fillRect(4, 4, 8, 8);
            g.fillStyle = '#8a6a40';
            g.fillRect(6, 6, 4, 4);
        });
        const leavesT = tex(g => fill(g, ['#3e7a24', '#468a2a', '#357020', '#509731', '#2e641c']));
        const iceT = tex(g => {
            fill(g, ['#aee2f7', '#a3dcf4', '#bfe9fb', '#98d6f0']);
            g.fillStyle = 'rgba(255,255,255,.6)';
            g.fillRect(2, 3, 5, 1);
            g.fillRect(9, 9, 4, 1);
            g.fillRect(5, 13, 3, 1);
        });
        const slimeT = tex(g => {
            fill(g, ['#7bd94a', '#6ccf3d', '#8be35c']);
            g.fillStyle = '#3f8f1e';
            for (let i = 0; i < 8; i++) g.fillRect((Math.random() * 16) | 0, (Math.random() * 16) | 0, 2, 2);
        });
        const breakT = tex(g => {
            fill(g, ['#d8c07a', '#cdb46f', '#e0c886']);
            g.fillStyle = '#6b5a30';
            g.fillRect(2, 3, 7, 1);
            g.fillRect(8, 4, 1, 4);
            g.fillRect(4, 8, 6, 1);
            g.fillRect(11, 9, 3, 1);
            g.fillRect(5, 9, 1, 4);
            g.fillRect(12, 2, 1, 3);
        });
        const moveT = tex(g => {
            fill(g, ['#9aa3b5', '#8f98aa', '#a5aec0']);
            g.fillStyle = 'rgba(30,40,60,.5)';
            g.fillRect(0, 7, 16, 1);
            g.fillRect(0, 15, 16, 1);
            g.fillRect(7, 0, 1, 7);
            g.fillRect(3, 8, 1, 7);
            g.fillRect(11, 8, 1, 7);
        });
        const goldT = tex(g => fill(g, ['#f7d94c', '#eec83a', '#ffe36a', '#e0b82e']));
        const ms = t => new THREE.MeshLambertMaterial({
            map: t
        });
        const mats = {
            grass: [ms(grassSide), ms(grassSide), ms(grassTop), ms(dirtT), ms(grassSide), ms(grassSide)],
            dirt: ms(dirtT),
            stone: ms(stoneT),
            plank: ms(plankT),
            sand: ms(sandT),
            log: [ms(logT), ms(logT), ms(logTop), ms(logTop), ms(logT), ms(logT)],
            leaves: ms(leavesT),
            gold: ms(goldT),
            ice: new THREE.MeshLambertMaterial({
                map: iceT,
                emissive: 0x10303c
            }),
            slime: new THREE.MeshLambertMaterial({
                map: slimeT,
                emissive: 0x143a0c
            }),
            break: ms(breakT),
            move: ms(moveT)
        };

        /* ---------- جهان ---------- */
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const blockMap = new Map();
        let plats = [],
            movers = [],
            coins = [],
            falling = [],
            nextPlatIndex = 1;
        const breakTimers = new Map();
        let checkpoint = null;
        const coinMat = new THREE.MeshLambertMaterial({
            color: 0xffd23e,
            emissive: 0x7a5a00
        });

        function addBlock(x, y, z, type, plat, solid = true) {
            const mesh = new THREE.Mesh(boxGeo, mats[type]);
            mesh.position.set(x + .5, y + .5, z + .5);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const key = x + ',' + y + ',' + z;
            if (solid) blockMap.set(key, {
                plat,
                type,
                mesh
            });
            return {
                mesh,
                key
            };
        }

        function spawnCoin(x, y, z, plat) {
            const grp = new THREE.Group();
            const m = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.09, 14), coinMat);
            m.rotation.x = Math.PI / 2;
            m.castShadow = true;
            grp.add(m);
            grp.position.set(x, y, z);
            scene.add(grp);
            coins.push({
                mesh: grp,
                x,
                y,
                z,
                plat,
                phase: Math.random() * 6.28
            });
        }

        function spawnFlag(bx, ny, bz, meshesArr) {
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.09, 2.1, 0.09), ms(goldT));
            pole.position.set(bx + 0.15, ny + 1.05, bz + 0.15);
            pole.castShadow = true;
            const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.45), new THREE.MeshLambertMaterial({
                color: 0xe33b3b,
                side: THREE.DoubleSide
            }));
            flag.position.set(bx + 0.57, ny + 1.8, bz + 0.15);
            scene.add(pole);
            scene.add(flag);
            meshesArr.push({
                mesh: pole,
                key: null
            }, {
                mesh: flag,
                key: null
            });
        }

        function moverRegister(m) {
            for (const k of m.keys) blockMap.delete(k);
            m.keys.length = 0;
            for (const e of m.entries) {
                const key = (m.snapX + e.dx) + ',' + m.y + ',' + (m.z + e.dz);
                blockMap.set(key, {
                    plat: m.plat,
                    type: 'move',
                    mesh: null
                });
                m.keys.push(key);
            }
        }

        function genPlatform(i) {
            const t = Math.min(i / 28, 1),
                prev = plats[plats.length - 1];
            let special = null;
            if (i >= 8 && Math.random() < 0.12 + 0.08 * t) special = 'moving';
            else if (i >= 6) {
                const r = Math.random();
                if (r < 0.12) special = 'ice';
                else if (r < 0.23) special = 'slime';
                else if (r < 0.33) special = 'break';
            }
            let dy = 0;
            if (i >= 3) {
                const r = Math.random(),
                    downP = .30 + .25 * t;
                if (special === 'moving') dy = Math.random() < 0.5 ? 0 : -1;
                else if (r < .15) dy = 1;
                else if (r < .15 + downP) dy = -(1 + ((Math.random() * (1 + Math.round(2 * t))) | 0));
                else dy = 0;
            }
            const ny = clamp(prev.y + dy, 5, 22);
            dy = ny - prev.y;
            let maxGap;
            if (special === 'moving') maxGap = 2;
            else if (dy === 1) maxGap = 1;
            else if (dy === 0) maxGap = t < .4 ? 2 : 3;
            else if (dy === -1) maxGap = 3;
            else maxGap = 4;
            const gap = Math.max(1, Math.round(1 + Math.random() * (maxGap - 1) * (.35 + .65 * t)));
            let w = Math.max(1, Math.round(2.7 - t * 1.5 - Math.random() * .7));
            let d = Math.random() < .5 * t ? 1 : 2;
            if (special === 'ice') {
                w = Math.max(2, w);
                d = 2;
            }
            if (special === 'break') {
                d = Math.max(2, d);
            }
            const x = clamp(prev.x + Math.round((Math.random() - .5) * (1 + 2 * t)), -8, 8);
            const z = prev.z + prev.d + gap;
            const typeMap = {
                ice: 'ice',
                slime: 'slime',
                break: 'break',
                moving: 'move'
            };
            const type = special ? typeMap[special] : rnd(['grass', 'grass', 'stone', 'plank', 'sand', 'log']);
            const meshes = [];
            let mover = null;
            if (special === 'moving') {
                w = 2;
                mover = {
                    plat: i,
                    y: ny,
                    z,
                    w,
                    d,
                    baseX: x,
                    cx: x,
                    snapX: x,
                    phase: Math.random() * 6.28,
                    speed: 0.8 + Math.random() * 0.7 + t * 0.7,
                    amp: 1.0 + Math.random() * 0.6 + t * 0.4,
                    entries: [],
                    meshes: [],
                    keys: []
                };
                for (let xi = 0; xi < w; xi++)
                    for (let zi = 0; zi < d; zi++) {
                        const mesh = new THREE.Mesh(boxGeo, mats.move);
                        mesh.castShadow = mesh.receiveShadow = true;
                        mesh.position.set(x + xi + 0.5, ny + 0.5, z + zi + 0.5);
                        scene.add(mesh);
                        mover.entries.push({
                            dx: xi,
                            dz: zi
                        });
                        mover.meshes.push(mesh);
                    }
                movers.push(mover);
                moverRegister(mover);
            } else {
                for (let xi = 0; xi < w; xi++)
                    for (let zi = 0; zi < d; zi++) {
                        meshes.push(addBlock(x + xi, ny, z + zi, type, i));
                        meshes.push(addBlock(x + xi, ny - 1, z + zi, type === 'grass' ? 'dirt' : 'stone', i));
                    }
                if (Math.random() < 0.65) {
                    spawnCoin(x + ((Math.random() * w) | 0) + 0.5, ny + 1.25, z + ((Math.random() * d) | 0) + 0.5, i);
                }
                if (i % 10 === 0) spawnFlag(x, ny, z, meshes);
            }
            plats.push({
                index: i,
                x,
                y: ny,
                z,
                w,
                d,
                meshes,
                mover
            });
            nextPlatIndex = i + 1;
        }

        function buildStart() {
            const y0 = 10,
                meshes = [];
            for (let x = -3; x <= 3; x++)
                for (let z = 0; z <= 6; z++) {
                    meshes.push(addBlock(x, y0, z, 'grass', 0));
                    meshes.push(addBlock(x, y0 - 1, z, 'dirt', 0));
                }
            plats.push({
                index: 0,
                x: -3,
                y: y0,
                z: 0,
                w: 7,
                d: 7,
                meshes,
                mover: null
            });
            // تمپل
            for (const px of[-3, 3])
                for (const pz of[0, 2])
                    for (let h = 1; h <= 3; h++)
                        meshes.push(addBlock(px, y0 + h, pz, 'stone', 0));
            for (let x = -3; x <= 3; x++)
                for (let z = 0; z <= 2; z++)
                    meshes.push(addBlock(x, y0 + 4, z, 'stone', 0));
            meshes.push(addBlock(0, y0 + 5, 1, 'gold', 0));
        }

        function removePlat(p) {
            for (const e of p.meshes) {
                scene.remove(e.mesh);
                if (e.key) {
                    blockMap.delete(e.key);
                    breakTimers.delete(e.key);
                }
            }
            if (p.mover) {
                for (const k of p.mover.keys) blockMap.delete(k);
                for (const m of p.mover.meshes) scene.remove(m);
                const ix = movers.indexOf(p.mover);
                if (ix >= 0) movers.splice(ix, 1);
            }
            coins = coins.filter(c => {
                if (c.plat === p.index) {
                    scene.remove(c.mesh);
                    return false;
                }
                return true;
            });
        }

        function ensureWorld(cur) {
            while (nextPlatIndex < cur + 8) genPlatform(nextPlatIndex);
            const keepFrom = Math.min(cur - 4, checkpoint ? checkpoint.plat : cur - 4);
            while (plats.length && plats[0].index < keepFrom) removePlat(plats.shift());
        }

        function resetWorld() {
            for (const p of plats) removePlat(p);
            plats = [];
            movers = [];
            coins = [];
            falling = [];
            breakTimers.clear();
            blockMap.clear();
            nextPlatIndex = 1;
            buildStart();
            for (let i = 1; i < 8; i++) genPlatform(i);
        }

        /* ---------- کاراکتر ---------- */
        let playerModel, charParts = {},
            walkT = 0;

        function buildCharacter() {
            const g = new THREE.Group();
            const skinC = ['#e8b07a', '#dfa76e', '#eec08a'];
            const skinM = ms(tex(g2 => fill(g2, skinC)));
            const hairM = ms(tex(g2 => fill(g2, ['#4a2f1b', '#3f2817', '#553722'])));
            const faceM = tex(g2 => {
                fill(g2, skinC);
                g2.fillStyle = '#3f2817';
                g2.fillRect(0, 0, 16, 4);
                g2.fillStyle = '#fff';
                g2.fillRect(3, 8, 3, 2);
                g2.fillRect(10, 8, 3, 2);
                g2.fillStyle = '#4a3f8f';
                g2.fillRect(5, 8, 1, 2);
                g2.fillRect(10, 8, 1, 2);
                g2.fillStyle = '#a8674b';
                g2.fillRect(6, 12, 4, 1);
            });
            const shirtM = ms(tex(g2 => fill(g2, ['#2fa8a0', '#2a9a92', '#36b5ab'])));
            const pantsM = ms(tex(g2 => fill(g2, ['#3b55c4', '#354db5', '#415dd0'])));
            const head = new THREE.Mesh(boxGeo, [skinM, skinM, hairM, skinM, new THREE.MeshLambertMaterial({
                map: faceM
            }), skinM]);
            head.scale.set(0.5, 0.5, 0.5);
            head.position.y = 1.58;
            g.add(head);
            const body = new THREE.Mesh(boxGeo, shirtM);
            body.scale.set(0.5, 0.6, 0.28);
            body.position.y = 1.03;
            g.add(body);

            function limb(mat, w, h, px, py) {
                const piv = new THREE.Group();
                piv.position.set(px, py, 0);
                const m = new THREE.Mesh(boxGeo, mat);
                m.scale.set(w, h, w);
                m.position.y = -h / 2;
                piv.add(m);
                g.add(piv);
                return piv;
            }
            charParts.legL = limb(pantsM, 0.24, 0.73, -0.13, 0.73);
            charParts.legR = limb(pantsM, 0.24, 0.73, 0.13, 0.73);
            charParts.armL = limb(shirtM, 0.2, 0.66, -0.36, 1.28);
            charParts.armR = limb(shirtM, 0.2, 0.66, 0.36, 1.28);
            g.traverse(o => {
                if (o.isMesh) o.castShadow = true;
            });
            scene.add(g);
            return g;
        }
        playerModel = buildCharacter();

        /* ---------- بازیکن و فیزیک ---------- */
        const player = {
            pos: new THREE.Vector3(),
            vel: new THREE.Vector3(),
            onGround: false
        };
        const PW = .3,
            PH = 1.8,
            GRAV = 28,
            JUMP = 8.4,
            SPEED = 5.6;
        let yaw = Math.PI,
            pitch = -.05,
            lastPlat = 0,
            jumpBuf = 0,
            jumps = 0,
            shake = 0;
        const input = {
            x: 0,
            y: 0
        };

        function collides(px, py, pz) {
            const x0 = Math.floor(px - PW),
                x1 = Math.floor(px + PW);
            const y0 = Math.floor(py),
                y1 = Math.floor(py + PH - .001);
            const z0 = Math.floor(pz - PW),
                z1 = Math.floor(pz + PW);
            for (let x = x0; x <= x1; x++)
                for (let y = y0; y <= y1; y++)
                    for (let z = z0; z <= z1; z++)
                        if (blockMap.has(x + ',' + y + ',' + z)) return true;
            return false;
        }

        function probe(py) {
            const y = Math.floor(py);
            for (const ox of[-.25, .25])
                for (const oz of[-.25, .25]) {
                    const b = blockMap.get(Math.floor(player.pos.x + ox) + ',' + y + ',' + Math.floor(player.pos.z + oz));
                    if (b) return b;
                }
            return null;
        }

        function tryJump() {
            if (state !== 'playing') return;
            if (player.onGround) {
                player.vel.y = JUMP;
                player.onGround = false;
                jumps = 0;
                sfx('jump');
            } else if (unlocked && jumps < 1) {
                player.vel.y = JUMP * 0.95;
                jumps = 1;
                sfx('dj');
            } else jumpBuf = 0.12;
        }

        function updateMovers(dt) {
            for (const m of movers) {
                m.phase += dt * m.speed;
                const prevCx = m.cx;
                m.cx = m.baseX + Math.sin(m.phase) * m.amp;
                const ns = Math.round(m.cx);
                if (ns !== m.snapX) {
                    m.snapX = ns;
                    moverRegister(m);
                }
                for (let k = 0; k < m.meshes.length; k++) m.meshes[k].position.x = m.cx + m.entries[k].dx + 0.5;
                if (player.onGround) {
                    const pu = probe(player.pos.y - 0.05);
                    if (pu && pu.plat === m.plat) player.pos.x += m.cx - prevCx;
                }
            }
        }

        function collapseBlock(key) {
            const info = blockMap.get(key);
            if (!info || !info.mesh) return;
            blockMap.delete(key);
            breakTimers.delete(key);
            falling.push({
                mesh: info.mesh,
                vy: 0,
                t: 0,
                rx: (Math.random() - .5) * 4,
                rz: (Math.random() - .5) * 4
            });
            sfx('break');
        }

        function collectCoin(i) {
            const c = coins[i];
            scene.remove(c.mesh);
            coins.splice(i, 1);
            coinsTotal++;
            sfx('coin');
            persist();
            if (!unlocked && coinsTotal >= 30) {
                unlocked = true;
                shieldCharges = 1;
                sfx('unlock');
                persist();
                toast('🎉 ۳۰ سکه کامل شد! پرش دوبل و سپر سقوط فعال شد!');
            }
            updateHUD();
        }

        function physStep(dt) {
            updateMovers(dt);
            const gi = player.onGround ? probe(player.pos.y - 0.05) : null;
            const icy = gi && gi.type === 'ice';
            let ix = input.x,
                iz = input.y;
            const l = Math.hypot(ix, iz);
            if (l > 1) {
                ix /= l;
                iz /= l;
            }
            const sy = Math.sin(yaw),
                cy = Math.cos(yaw);
            const mx = -sy * iz + cy * ix,
                mz = -cy * iz - sy * ix;
            const acc = player.onGround ? (icy ? 7 : 70) : 25;
            player.vel.x = approach(player.vel.x, mx * SPEED, acc * dt);
            player.vel.z = approach(player.vel.z, mz * SPEED, acc * dt);
            if (jumpBuf > 0 && player.onGround) {
                player.vel.y = JUMP;
                player.onGround = false;
                jumps = 0;
                jumpBuf = 0;
                sfx('jump');
            }
            jumpBuf -= dt;
            player.vel.y = Math.max(player.vel.y - GRAV * dt, -40);
            const nx = player.pos.x + player.vel.x * dt;
            if (collides(nx, player.pos.y, player.pos.z)) player.vel.x = 0;
            else player.pos.x = nx;
            const nz = player.pos.z + player.vel.z * dt;
            if (collides(player.pos.x, player.pos.y, nz)) player.vel.z = 0;
            else player.pos.z = nz;
            const ny = player.pos.y + player.vel.y * dt;
            if (collides(player.pos.x, ny, player.pos.z)) {
                if (player.vel.y < 0) {
                    const hit = probe(ny);
                    if (hit && hit.type === 'slime' && player.vel.y < -3) {
                        player.vel.y = 10.5;
                        jumps = 0;
                        shake = Math.max(shake, 0.2);
                        sfx('bounce');
                    } else {
                        const vy = player.vel.y;
                        if (vy < -12) sfx('land');
                        if (vy < -9) {
                            shake = Math.max(shake, Math.min(0.4, (-vy - 8) * 0.05));
                        }
                        const snap = Math.floor(ny) + 1;
                        if (!collides(player.pos.x, snap, player.pos.z)) player.pos.y = snap;
                        player.onGround = true;
                        jumps = 0;
                    }
                }
                player.vel.y = Math.max(player.vel.y, 0) === 0 && player.vel.y < 0 ? 0 : player.vel.y;
                if (player.onGround) player.vel.y = 0;
                else player.vel.y = Math.max(player.vel.y, 0);
            } else {
                player.pos.y = ny;
                player.onGround = false;
            }
            if (player.onGround) {
                const gb = probe(player.pos.y - 0.05);
                if (gb && gb.type === 'break' && !breakTimers.has(gb.key)) {
                    breakTimers.set(gb.key, 1.0);
                    sfx('crack');
                }
                const pu = gb;
                if (pu && pu.plat !== lastPlat) {
                    lastPlat = pu.plat;
                    if (pu.plat > score) {
                        score = pu.plat;
                        updateHUD();
                        sfx('score');
                        if (score > best) {
                            best = score;
                            persist();
                        }
                        if (score % 10 === 0) {
                            const pl = plats.find(p => p.index === score);
                            if (pl) {
                                checkpoint = {
                                    plat: score,
                                    score: score,
                                    pos: new THREE.Vector3(pl.x + pl.w / 2, pl.y + 1.01, pl.z + pl.d / 2)
                                };
                                sfx('checkpoint');
                                toast('🚩 چک‌پوینت ذخیره شد!');
                            }
                        }
                        ensureWorld(pu.plat);
                    }
                }
            }
            for (const [key, tv] of[...breakTimers]) {
                const nt = tv - dt;
                if (nt <= 0) collapseBlock(key);
                else breakTimers.set(key, nt);
            }
            for (let i = coins.length - 1; i >= 0; i--) {
                const c = coins[i];
                const dx = c.x - player.pos.x,
                    dy = c.y - (player.pos.y + 0.9),
                    dz = c.z - player.pos.z;
                if (dx * dx + dy * dy + dz * dz < 1.15) collectCoin(i);
            }
            let minY = 1e9;
            for (const pl of plats)
                if (pl.y < minY) minY = pl.y;
            if (player.pos.y < minY - 9) fallOut();
        }

        function fallOut() {
            if (unlocked && shieldCharges > 0) {
                shieldCharges--;
                updateHUD();
                sfx('checkpoint');
                toast('🛡 سپر نجات فعال شد!');
                respawnAt(checkpoint);
                return;
            }
            die();
        }

        /* ---------- جریان بازی ---------- */
        function defaultCP() {
            return {
                plat: 0,
                score: 0,
                pos: new THREE.Vector3(0.5, 12.2, 4.5)
            };
        }

        function respawnAt(cp) {
            player.pos.copy(cp.pos);
            player.vel.set(0, 0, 0);
            yaw = Math.PI;
            pitch = -0.05;
            jumps = 0;
            jumpBuf = 0;
            lastPlat = cp.plat;
            score = cp.score;
            ensureWorld(cp.plat);
            shieldCharges = unlocked ? 1 : 0;
            state = 'playing';
            hideAllPanels();
            show($('hud'));
            document.body.classList.add('ingame');
            updateHUD();
            if (!modeTouch) cv.requestPointerLock();
        }

        function startGame() {
            runStartBest = best;
            resetWorld();
            checkpoint = defaultCP();
            respawnAt(checkpoint);
        }

        function die() {
            if (state !== 'playing') return;
            state = 'dead';
            sfx('die');
            document.exitPointerLock && document.exitPointerLock();
            hide($('hud'));
            document.body.classList.remove('ingame');
            $('finalScore').textContent = toFa(score);
            $('goBest').textContent = toFa(best);
            $('newRec').classList.toggle('hidden', !(score > runStartBest && score > 0));
            $('cpBtn').classList.toggle('hidden', !(checkpoint && checkpoint.plat > 0));
            only(panels.gameover);
        }

        function toMenu() {
            state = 'menu';
            document.exitPointerLock && document.exitPointerLock();
            hide($('hud'));
            document.body.classList.remove('ingame');
            syncMenu();
            only(panels.menu);
        }

        function togglePause() {
            if (state === 'playing') {
                state = 'paused';
                only(panels.pause);
                document.exitPointerLock && document.exitPointerLock();
            } else if (state === 'paused') {
                state = 'playing';
                hide(panels.pause);
                if (!modeTouch) cv.requestPointerLock();
            }
        }

        /* ---------- صدا ---------- */
        let actx = null,
            master = null,
            delayNode = null,
            started = false,
            musicTimer = null;

        function initAudio() {
            if (!soundOn) return;
            if (!started) {
                started = true;
                actx = new(window.AudioContext || window.webkitAudioContext)();
                master = actx.createGain();
                master.gain.value = .45;
                master.connect(actx.destination);
                delayNode = actx.createDelay();
                delayNode.delayTime.value = .65;
                const fb = actx.createGain();
                fb.gain.value = .4;
                delayNode.connect(fb);
                fb.connect(delayNode);
                const wet = actx.createGain();
                wet.gain.value = .4;
                delayNode.connect(wet);
                wet.connect(master);
                startMusic();
            }
            if (actx.state === 'suspended') actx.resume();
        }

        function padNote(f, vol) {
            const o = actx.createOscillator(),
                g = actx.createGain(),
                lfo = actx.createOscillator(),
                lg = actx.createGain();
            o.type = 'sine';
            o.frequency.value = f;
            g.gain.value = vol;
            lfo.type = 'sine';
            lfo.frequency.value = 0.05 + Math.random() * 0.05;
            lg.gain.value = vol * 0.4;
            lfo.connect(lg);
            lg.connect(g.gain);
            o.connect(g);
            g.connect(master);
            o.start();
            lfo.start();
        }
        const melody = [440, 493.88, 554.37, 659.25, 739.99, 880];

        function pluck(f, dur) {
            const o = actx.createOscillator(),
                g = actx.createGain(),
                t = actx.currentTime;
            o.type = 'triangle';
            o.frequency.value = f;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(.09, t + .15);
            g.gain.exponentialRampToValueAtTime(.0008, t + dur);
            o.connect(g);
            g.connect(master);
            g.connect(delayNode);
            o.start(t);
            o.stop(t + dur + .1);
        }

        function startMusic() {
            padNote(110, .05);
            padNote(164.81, .04);
            padNote(220, .03);
            padNote(277.18, .02);
            padNote(329.63, .018);
            scheduleMelody();
        }

        function scheduleMelody() {
            if (!soundOn) return;
            if (Math.random() < .85) pluck(melody[(Math.random() * melody.length) | 0], 2.8);
            musicTimer = setTimeout(scheduleMelody, 1400 + Math.random() * 1800);
        }

        function tone(f0, f1, dur, vol, type, off) {
            const t = actx.currentTime + (off || 0),
                o = actx.createOscillator(),
                g = actx.createGain();
            o.type = type || 'sine';
            o.frequency.setValueAtTime(f0, t);
            if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(.001, t + dur);
            o.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + dur + .05);
        }

        function sfx(k) {
            if (!soundOn || !actx) return;
            if (k === 'jump') tone(300, 560, .12, .15);
            else if (k === 'dj') tone(420, 760, .14, .14);
            else if (k === 'land') tone(150, 70, .1, .12, 'triangle');
            else if (k === 'score') tone(880, 0, .22, .08);
            else if (k === 'coin') {
                tone(988, 0, .08, .1);
                tone(1319, 0, .18, .1, 'sine', .07);
            } else if (k === 'checkpoint') {
                tone(659, 0, .12, .1);
                tone(880, 0, .25, .1, 'sine', .12);
            } else if (k === 'bounce') tone(180, 520, .18, .14);
            else if (k === 'break') tone(220, 80, .14, .13, 'square');
            else if (k === 'crack') tone(700, 500, .05, .05, 'square');
            else if (k === 'unlock') {
                tone(523, 0, .15, .1);
                tone(659, 0, .15, .1, 'sine', .13);
                tone(784, 0, .15, .1, 'sine', .26);
                tone(1047, 0, .4, .1, 'sine', .39);
            } else if (k === 'die') tone(300, 60, .6, .14, 'sawtooth');
        }
        let soundOn = true;
        try {
            soundOn = localStorage.getItem('pk_sound') !== '0';
        } catch (e) {}

        /* ---------- ورودی ---------- */
        const keys = {};
        addEventListener('keydown', e => {
            initAudio();
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
            if (e.code === 'Space' && state === 'playing') {
                if (!e.repeat) tryJump();
                else jumpBuf = 0.1;
            }
            if (e.code === 'KeyV' && state === 'playing') thirdPerson = !thirdPerson;
            if (e.code === 'Escape' && !modeTouch && (state === 'playing' || state === 'paused')) togglePause();
            keys[e.code] = true;
        });
        addEventListener('keyup', e => keys[e.code] = false);

        function pollKeys() {
            let x = 0,
                y = 0;
            if (keys.KeyW || keys.ArrowUp) y += 1;
            if (keys.KeyS || keys.ArrowDown) y -= 1;
            if (keys.KeyA || keys.ArrowLeft) x -= 1;
            if (keys.KeyD || keys.ArrowRight) x += 1;
            return {
                x,
                y
            };
        }
        cv.addEventListener('click', () => {
            initAudio();
            if (state === 'playing' && !modeTouch) cv.requestPointerLock();
        });
        document.addEventListener('mousemove', e => {
            if (!modeTouch && document.pointerLockElement === cv) {
                yaw -= e.movementX * .0024;
                pitch = clamp(pitch - e.movementY * .0024, -1.55, 1.55);
            }
        });
        /*-pointer events: جوی‌استیک و نگاه (لمسی)*/
        const joy = {
                id: null,
                bx: 0,
                by: 0
            },
            look = {
                id: null,
                lx: 0,
                ly: 0
            };
        const joyBase = $('joyBase'),
            joyKnob = $('joyKnob');
        addEventListener('pointerdown', e => {
            initAudio();
            if (e.target.closest && e.target.closest('#jumpBtn')) {
                if (modeTouch && state === 'playing') tryJump();
                return;
            }
            if (!modeTouch || state !== 'playing') return;
            if (e.target.closest && e.target.closest('.btn,.icobtn')) return;
            if (joy.id === null && e.clientX < innerWidth * .45 && e.clientY > innerHeight * .3) {
                joy.id = e.pointerId;
                joy.bx = e.clientX;
                joy.by = e.clientY;
                joyBase.style.display = 'block';
                joyBase.style.left = e.clientX + 'px';
                joyBase.style.top = e.clientY + 'px';
                joyKnob.style.transform = 'translate(-50%,-50%)';
            } else if (look.id === null) {
                look.id = e.pointerId;
                look.lx = e.clientX;
                look.ly = e.clientY;
            }
        });
        addEventListener('pointermove', e => {
            if (e.pointerId === joy.id) {
                let dx = (e.clientX - joy.bx) / 50,
                    dy = (e.clientY - joy.by) / 50;
                const l = Math.hypot(dx, dy);
                if (l > 1) {
                    dx /= l;
                    dy /= l;
                }
                input.x = dx;
                input.y = -dy;
                joyKnob.style.transform = 'translate(calc(-50% + ' + dx * 38 + 'px),calc(-50% + ' + dy * 38 + 'px))';
            } else if (e.pointerId === look.id) {
                const dx = e.clientX - look.lx,
                    dy = e.clientY - look.ly;
                look.lx = e.clientX;
                look.ly = e.clientY;
                yaw -= dx * .005;
                pitch = clamp(pitch - dy * .005, -1.55, 1.55);
            }
        });

        function pUp(e) {
            if (e.pointerId === joy.id) {
                joy.id = null;
                input.x = 0;
                input.y = 0;
                joyBase.style.display = 'none';
            }
            if (e.pointerId === look.id) look.id = null;
        }
        addEventListener('pointerup', pUp);
        addEventListener('pointercancel', pUp);
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && state === 'playing') togglePause();
        });

        /* ---------- UI ---------- */
        const $ = id => document.getElementById(id);
        const panels = {
            device: $('device'),
            menu: $('menu'),
            help: $('help'),
            pause: $('pause'),
            gameover: $('gameover')
        };

        function show(el) {
            el.classList.remove('hidden');
        }

        function hide(el) {
            el.classList.add('hidden');
        }

        function hideAllPanels() {
            for (const k in panels) hide(panels[k]);
        }

        function only(p) {
            hideAllPanels();
            if (p) show(p);
        }
        let toastTimer = null;

        function toast(msg) {
            const el = $('toast');
            el.textContent = msg;
            el.classList.add('on');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('on'), 2300);
        }

        function updateHUD() {
            $('scoreChip').textContent = 'امتیاز: ' + toFa(score);
            $('coinChip').textContent = '🪙 ' + toFa(coinsTotal);
            $('bestChip').textContent = 'رکورد: ' + toFa(best);
            $('powChip').textContent = unlocked ? ('⚡ دوبل | 🛡 ' + (shieldCharges ? '✓' : '✗')) : ('🪙 ' + toFa(coinsTotal) + '/۳۰');
        }

        function syncMenu() {
            $('bestLine').textContent = 'بهترین رکورد: ' + toFa(best);
            $('coinLine').textContent = unlocked ? '⚡ پرش دوبل و سپر سقوط: فعال ✅' : '🪙 سکه‌ها: ' + toFa(coinsTotal) + ' از ۳۰';
        }

        function setMode(touch) {
            modeTouch = touch;
            document.body.classList.toggle('mode-touch', touch);
            document.body.classList.toggle('mode-desk', !touch);
            state = 'menu';
            syncMenu();
            only(panels.menu);
        }
        $('devTouch').onclick = () => setMode(true);
        $('devDesk').onclick = () => setMode(false);
        $('devChangeBtn').onclick = () => {
            state = 'device';
            only(panels.device);
        };
        $('pauseDevBtn').onclick = () => {
            state = 'device';
            hide($('hud'));
            document.body.classList.remove('ingame');
            only(panels.device);
        };
        $('startBtn').onclick = startGame;
        $('retryBtn').onclick = startGame;
        $('restartBtn').onclick = startGame;
        $('cpBtn').onclick = () => {
            if (checkpoint) respawnAt(checkpoint);
        };
        $('resumeBtn').onclick = togglePause;
        $('pauseBtn').onclick = togglePause;
        $('viewBtn').onclick = () => thirdPerson = !thirdPerson;
        $('pauseMenuBtn').onclick = toMenu;
        $('goMenuBtn').onclick = toMenu;
        $('helpBack').onclick = () => only(panels.menu);
        $('helpBtn').onclick = () => {
            const base = '🪙 سکه جمع کن؛ با ۳۰ سکه «پرش دوبل» و «سپر سقوط» فعال می‌شود.<br>🚩 هر ۱۰ سکو یک چک‌پوینت است؛ بعد از سقوط می‌توانی از آنجا ادامه بدهی.<br>🧊 بلوک یخی لیز است، 🟢 اسلایم پرتابت می‌کند، 🟫 شکننده بعد از ۱ ثانیه می‌افتد، ⬜ متحرک جابه‌جا می‌شود.<br>👁 تغییر دید: دکمه «دید» یا کلید V<br><br>';
            $('helpText').innerHTML = base + (modeTouch ?
                'حرکت: جوی‌استیک سمت چپ<br>نگاه: کشیدن انگشت روی صفحه<br>پرش: دکمه «پرش» (پرش دوبل: دوبار بزن)<br>توقف: دکمه ⏸' :
                'حرکت: WASD یا جهت‌نما<br>پرش: Space (پرش دوبل: دوبار بزن)<br>نگاه: موس (کلیک برای قفل موس)<br>توقف: Esc');
            only(panels.help);
        };
        const soundBtn = $('soundBtn');

        function syncSoundBtn() {
            soundBtn.textContent = soundOn ? '🔊 صدا: روشن' : '🔇 صدا: خاموش';
        }
        soundBtn.onclick = () => {
            soundOn = !soundOn;
            try {
                localStorage.setItem('pk_sound', soundOn ? '1' : '0');
            } catch (e) {}
            syncSoundBtn();
            if (!soundOn) clearTimeout(musicTimer);
            else {
                started = false;
                initAudio();
            }
        };
        syncSoundBtn();
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        /* ---------- دوربین ---------- */
        const _v1 = new THREE.Vector3(),
            _v2 = new THREE.Vector3(),
            _v3 = new THREE.Vector3();

        function updateCamera(dt) {
            const eye = _v1.set(player.pos.x, player.pos.y + 1.62, player.pos.z);
            const cp = Math.cos(pitch),
                sp = Math.sin(pitch);
            const fwd = _v2.set(-Math.sin(yaw) * cp, sp, -Math.cos(yaw) * cp);
            const third = thirdPerson || state !== 'playing';
            playerModel.visible = third;
            if (third) {
                camera.position.copy(eye).addScaledVector(fwd, -4.1);
                camera.position.y += 0.4;
                camera.lookAt(_v3.copy(eye).addScaledVector(fwd, 3));
            } else {
                camera.position.copy(eye);
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;
            }
            if (shake > 0.002) {
                camera.position.x += (Math.random() - .5) * shake;
                camera.position.y += (Math.random() - .5) * shake;
                camera.position.z += (Math.random() - .5) * shake;
                shake *= Math.exp(-7 * dt);
            } else shake = 0;
            sky.position.copy(camera.position);
            sunSpr.position.set(camera.position.x + 120, camera.position.y + 170, camera.position.z + 320);
            sun.position.set(player.pos.x + 60, player.pos.y + 90, player.pos.z + 40);
            sun.target.position.copy(player.pos);
            sun.target.updateMatrixWorld();
        }

        /* ---------- حلقه اصلی ---------- */
        let lastT = performance.now(),
            acc = 0,
            menuT = 0;
        resetWorld();
        player.pos.set(0.5, 12.2, 4.5);

        function loop(now) {
            requestAnimationFrame(loop);
            let dt = Math.min((now - lastT) / 1000, .05);
            lastT = now;
            if (state === 'playing') {
                if (!modeTouch) {
                    const k = pollKeys();
                    input.x = k.x;
                    input.y = k.y;
                } else if (joy.id === null) {
                    input.x = 0;
                    input.y = 0;
                }
                acc = Math.min(acc + dt, .25);
                const step = 1 / 120;
                while (acc >= step) {
                    physStep(step);
                    acc -= step;
                }
            } else if (state === 'menu' || state === 'device') {
                menuT += dt;
                yaw = menuT * .3;
                pitch = -.22;
            }
            // انیمیشن کاراکتر
            const spd = Math.hypot(player.vel.x, player.vel.z);
            if (state === 'playing' && spd > .6) walkT += dt * (4 + spd);
            else walkT *= .85;
            const sw = player.onGround ? Math.sin(walkT) * .65 : .5;
            charParts.legL.rotation.x = sw;
            charParts.legR.rotation.x = -sw;
            charParts.armL.rotation.x = -sw * .7;
            charParts.armR.rotation.x = sw * .7;
            playerModel.position.copy(player.pos);
            if (spd > .6) playerModel.rotation.y = lerpAngle(playerModel.rotation.y, Math.atan2(player.vel.x, player.vel.z), Math.min(1, dt * 10));
            // ابرها، بلوک‌های در حال سقوط، سکه‌ها
            for (const c of clouds) {
                c.position.x += dt * 1.2;
                if (c.position.x > camera.position.x + 180) c.position.x -= 360;
                if (c.position.z < camera.position.z - 60) c.position.z += 360;
            }
            for (let i = falling.length - 1; i >= 0; i--) {
                const f = falling[i];
                f.vy -= 30 * dt;
                f.mesh.position.y += f.vy * dt;
                f.mesh.rotation.x += f.rx * dt;
                f.mesh.rotation.z += f.rz * dt;
                f.t += dt;
                if (f.t > 1.4) {
                    scene.remove(f.mesh);
                    falling.splice(i, 1);
                }
            }
            for (const c of coins) {
                c.mesh.rotation.y += dt * 2.5;
                c.mesh.position.y = c.y + Math.sin(now * .002 + c.phase) * .12;
            }
            updateCamera(dt);
            renderer.render(scene, camera);
        }
        syncMenu();
        requestAnimationFrame(loop);
    </script>
</body>
